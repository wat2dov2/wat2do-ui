<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Wat2Do mobile load-time overview</title>
  <desc id="desc">A time-only performance overview showing fast server response, first visible content around 1.2 seconds, mobile main content completion from 5.12 to 7.36 seconds, and total blocking time from 42 to 155 milliseconds. A before-and-after chart compares largest contentful paint across six routes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="currentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="regressedBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #5eead4; font-size: 16px; font-weight: 700; letter-spacing: 2.8px; }
      .title { fill: #f8fafc; font-size: 44px; font-weight: 750; }
      .subtitle { fill: #a8b3c7; font-size: 19px; }
      .card-label { fill: #a8b3c7; font-size: 16px; font-weight: 650; letter-spacing: 0.4px; }
      .card-value { fill: #f8fafc; font-size: 34px; font-weight: 760; }
      .card-note { fill: #8390a7; font-size: 15px; }
      .section-title { fill: #f8fafc; font-size: 25px; font-weight: 720; }
      .section-note { fill: #8f9bb0; font-size: 15px; }
      .route { fill: #dce5f3; font-size: 16px; font-weight: 600; }
      .axis { fill: #748198; font-size: 14px; }
      .value { fill: #dce5f3; font-size: 14px; font-weight: 650; }
      .delta-good { fill: #5eead4; font-size: 14px; font-weight: 700; }
      .delta-bad { fill: #fbbf24; font-size: 14px; font-weight: 700; }
      .takeaway-label { fill: #5eead4; font-size: 14px; font-weight: 750; letter-spacing: 2px; }
      .takeaway { fill: #f8fafc; font-size: 25px; font-weight: 680; }
      .footnote { fill: #8390a7; font-size: 14px; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="url(#background)"/>
  <circle cx="1450" cy="90" r="250" fill="#0f766e" opacity="0.10"/>
  <circle cx="130" cy="1110" r="250" fill="#2563eb" opacity="0.07"/>

  <text x="90" y="75" class="eyebrow">PERFORMANCE, IN PLAIN TIME</text>
  <text x="90" y="130" class="title">Wat2Do mobile load-time overview</text>
  <text x="90" y="168" class="subtitle">Corrected local production Lighthouse medians · 3 simulated-mobile runs per route · August 3, 2026</text>

  <g filter="url(#shadow)">
    <rect x="90" y="215" width="330" height="155" rx="22" fill="#111a2e" stroke="#25314a"/>
    <rect x="445" y="215" width="330" height="155" rx="22" fill="#111a2e" stroke="#25314a"/>
    <rect x="800" y="215" width="330" height="155" rx="22" fill="#111a2e" stroke="#25314a"/>
    <rect x="1155" y="215" width="355" height="155" rx="22" fill="#111a2e" stroke="#25314a"/>
  </g>

  <circle cx="122" cy="251" r="8" fill="#60a5fa"/>
  <text x="142" y="257" class="card-label">SERVER RESPONDS</text>
  <text x="120" y="310" class="card-value">0.16s cold</text>
  <text x="120" y="341" class="card-note">0.011s warm on org detail</text>

  <circle cx="477" cy="251" r="8" fill="#a78bfa"/>
  <text x="497" y="257" class="card-label">FIRST THING APPEARS</text>
  <text x="475" y="310" class="card-value">1.21-1.36s</text>
  <text x="475" y="341" class="card-note">First Contentful Paint</text>

  <circle cx="832" cy="251" r="8" fill="#f59e0b"/>
  <text x="852" y="257" class="card-label">MAIN CONTENT LOADS</text>
  <text x="830" y="310" class="card-value">5.12-7.36s</text>
  <text x="830" y="341" class="card-note">Largest Contentful Paint</text>

  <circle cx="1187" cy="251" r="8" fill="#22c55e"/>
  <text x="1207" y="257" class="card-label">BROWSER IS BLOCKED</text>
  <text x="1185" y="310" class="card-value">42-155ms</text>
  <text x="1185" y="341" class="card-note">All routes now below 200ms</text>

  <rect x="90" y="405" width="1420" height="610" rx="26" fill="#0e1728" stroke="#25314a" filter="url(#shadow)"/>
  <text x="125" y="457" class="section-title">When the main content finishes loading</text>
  <text x="125" y="487" class="section-note">Largest Contentful Paint, in seconds. Shorter is better.</text>

  <rect x="1007" y="438" width="18" height="10" rx="5" fill="#465168"/>
  <text x="1035" y="449" class="section-note">Before</text>
  <rect x="1115" y="438" width="18" height="10" rx="5" fill="url(#currentBar)"/>
  <text x="1143" y="449" class="section-note">After, faster</text>
  <rect x="1273" y="438" width="18" height="10" rx="5" fill="url(#regressedBar)"/>
  <text x="1301" y="449" class="section-note">After, slower</text>

  <!-- Plot starts at x=375 and uses 87.5 pixels per second through 12 seconds. -->
  <line x1="375" y1="525" x2="375" y2="930" stroke="#334158"/>
  <line x1="550" y1="525" x2="550" y2="930" stroke="#202c40"/>
  <line x1="725" y1="525" x2="725" y2="930" stroke="#202c40"/>
  <line x1="900" y1="525" x2="900" y2="930" stroke="#202c40"/>
  <line x1="1075" y1="525" x2="1075" y2="930" stroke="#202c40"/>
  <line x1="1250" y1="525" x2="1250" y2="930" stroke="#202c40"/>
  <line x1="1425" y1="525" x2="1425" y2="930" stroke="#334158"/>

  <line x1="594" y1="510" x2="594" y2="930" stroke="#22c55e" stroke-width="2" stroke-dasharray="7 7" opacity="0.75"/>
  <text x="603" y="522" fill="#4ade80" font-size="13" font-weight="700">2.5s good</text>
  <line x1="725" y1="510" x2="725" y2="930" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 7" opacity="0.75"/>
  <text x="735" y="545" fill="#fbbf24" font-size="13" font-weight="700">4.0s initial budget</text>

  <text x="375" y="960" class="axis" text-anchor="middle">0</text>
  <text x="550" y="960" class="axis" text-anchor="middle">2</text>
  <text x="725" y="960" class="axis" text-anchor="middle">4</text>
  <text x="900" y="960" class="axis" text-anchor="middle">6</text>
  <text x="1075" y="960" class="axis" text-anchor="middle">8</text>
  <text x="1250" y="960" class="axis" text-anchor="middle">10</text>
  <text x="1425" y="960" class="axis" text-anchor="middle">12s</text>

  <text x="125" y="578" class="route">Event feed</text>
  <rect x="375" y="546" width="983" height="14" rx="7" fill="#465168"/>
  <text x="1368" y="558" class="value">11.23</text>
  <rect x="375" y="569" width="601" height="14" rx="7" fill="url(#currentBar)"/>
  <text x="986" y="581" class="value">6.87</text>
  <text x="125" y="603" class="delta-good">38.8% faster</text>

  <text x="125" y="646" class="route">Event detail</text>
  <rect x="375" y="614" width="753" height="14" rx="7" fill="#465168"/>
  <text x="1138" y="626" class="value">8.60</text>
  <rect x="375" y="637" width="644" height="14" rx="7" fill="url(#currentBar)"/>
  <text x="1029" y="649" class="value">7.36</text>
  <text x="125" y="671" class="delta-good">14.4% faster</text>

  <text x="125" y="714" class="route">Organizations</text>
  <rect x="375" y="682" width="436" height="14" rx="7" fill="#465168"/>
  <text x="821" y="694" class="value">4.98</text>
  <rect x="375" y="705" width="455" height="14" rx="7" fill="url(#regressedBar)"/>
  <text x="840" y="717" class="value">5.20</text>
  <text x="125" y="739" class="delta-bad">4.5% slower</text>

  <text x="125" y="782" class="route">Organization detail</text>
  <rect x="375" y="750" width="956" height="14" rx="7" fill="#465168"/>
  <text x="1341" y="762" class="value">10.92</text>
  <rect x="375" y="773" width="529" height="14" rx="7" fill="url(#currentBar)"/>
  <text x="914" y="785" class="value">6.04</text>
  <text x="125" y="807" class="delta-good">44.7% faster</text>

  <text x="125" y="850" class="route">Contact</text>
  <rect x="375" y="818" width="430" height="14" rx="7" fill="#465168"/>
  <text x="815" y="830" class="value">4.91</text>
  <rect x="375" y="841" width="455" height="14" rx="7" fill="url(#regressedBar)"/>
  <text x="840" y="853" class="value">5.20</text>
  <text x="125" y="875" class="delta-bad">5.9% slower</text>

  <text x="125" y="918" class="route">Login</text>
  <rect x="375" y="886" width="363" height="14" rx="7" fill="#465168"/>
  <text x="748" y="898" class="value">4.15</text>
  <rect x="375" y="909" width="448" height="14" rx="7" fill="url(#regressedBar)"/>
  <text x="833" y="921" class="value">5.12</text>
  <text x="125" y="943" class="delta-bad">23.5% slower</text>

  <rect x="90" y="1045" width="1420" height="95" rx="22" fill="#11253a" stroke="#1f5560"/>
  <text x="125" y="1081" class="takeaway-label">WHAT THIS MEANS</text>
  <text x="125" y="1118" class="takeaway">The server is fast and blocking is under control. Mobile users still wait too long for the main content.</text>
  <text x="1475" y="1175" class="footnote" text-anchor="end">Desktop LCP: 1.04-1.91s · Mobile LCP target: under 4.0s initially, then 2.5s at field p75</text>
</svg>
