name: Hourly morning email

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      now:
        description: 'Optional ISO-8601 UTC timestamp for deterministic testing'
        required: false
        type: string

concurrency:
  group: hourly-morning-email
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --prefer-binary -r requirements.txt

      - name: Dispatch local 9 AM emails
        working-directory: backend
        env:
          ENVIRONMENT: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          EMAIL_PROVIDER: resend
          EMAIL_PROVIDER_API_KEY: ${{ secrets.EMAIL_PROVIDER_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_UNSUBSCRIBE_SECRET: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
          NOW: ${{ inputs.now }}
        run: |
          args=()
          if [[ -n "$NOW" ]]; then
            args+=(--now "$NOW")
          fi
          python jobs/send_notifications.py "${args[@]}"
