name: Instagram account stats

on:
  schedule:
    # 11:00 UTC is 6 or 7 a.m. in Toronto, before the 9 a.m. carousel curation.
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: instagram-account-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
      ENVIRONMENT: production

    steps:
      - uses: actions/checkout@v4

      - name: Verify stats configuration
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_RUNTIME_SECRET_ARN"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read stats configuration
        run: |
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "$AWS_RUNTIME_SECRET_ARN" \
            --query SecretString \
            --output text)"
          for secret_key in SUPABASE_URL SUPABASE_KEY SUPABASE_SECRET_KEY INSTAGRAM_TOKEN_ENCRYPTION_KEY; do
            secret_value="$(jq -er --arg key "$secret_key" '.[$key]' <<< "$secret_json")"
            echo "::add-mask::$secret_value"
            echo "$secret_key=$secret_value" >> "$GITHUB_ENV"
          done
          unset secret_json

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/requirements.lock"
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/.uv-cache

      - name: Set up Python
        working-directory: backend
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --python .venv/bin/python -r requirements.lock

      - name: Refresh tokens and snapshot every account
        working-directory: backend
        run: .venv/bin/python jobs/snapshot_instagram_accounts.py
