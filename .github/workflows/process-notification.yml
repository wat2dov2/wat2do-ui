name: Process Notifications
run-name: >-
  ${{
    github.event.client_payload.notification_dict && format('{0} - {1}', github.event.client_payload.notification_dict['android.title'], github.event.client_payload.notification_dict['android.subText']) ||
    inputs.notification_payload && format('{0} - {1}', fromJSON(inputs.notification_payload || '{}')['android.title'], fromJSON(inputs.notification_payload || '{}')['android.subText']) ||
    format('Process @{0}', inputs.poster_id)
  }}

# Process forwarded Instagram notifications or a manually selected handle.
# Triggered either manually (workflow_dispatch) or by an external service
# posting to repository_dispatch with type=new_instagram_post.
#
# When triggered manually, the workflow uses a five-year cutoff instead of
# one day so an admin can backfill an account that hasn't been scraped before.

on:
  repository_dispatch:
    types: [new_instagram_post]
  workflow_dispatch:
    inputs:
      poster_id:
        description: 'Instagram username to process'
        required: false
        type: string
      school:
        description: 'School name'
        required: false
        type: string
      notification_payload:
        description: 'Raw JSON payload of the notification'
        required: false
        type: string

jobs:
  select-runner:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check Mac mini runner status
        id: check
        env:
          RUNNER_CHECK_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          DEFAULT_GH_TOKEN: ${{ github.token }}
          CACHE_ENT_ID: ${{ github.event.client_payload.notification_dict.cache_ent_id || fromJSON(inputs.notification_payload || '{}').cache_ent_id || '' }}
          INSTAGRAM_ACTION: ${{ github.event.client_payload.notification_dict['com.instagram.android.igns.logging.ig_action'] || fromJSON(inputs.notification_payload || '{}')['com.instagram.android.igns.logging.ig_action'] || '' }}
        run: |
          export GH_TOKEN="${RUNNER_CHECK_TOKEN:-$DEFAULT_GH_TOKEN}"
          has_cache_ent_id=false
          if [[ -n "$CACHE_ENT_ID" || "$INSTAGRAM_ACTION" == *"cache_ent_id="* ]]; then
            has_cache_ent_id=true
          fi
          
          if [[ "$has_cache_ent_id" == "true" ]]; then
            status=$(gh api "repos/${{ github.repository }}/actions/runners" --jq '.runners[] | select(.name == "wat2do-mac-mini" or .name == "wat2do-scraper" or (.labels[]?.name == "wat2do-scraper")) | .status' 2>/dev/null || true)
            if echo "$status" | grep -q "online"; then
              echo "cache_ent_id processing requires the Mac mini and it is online."
              echo "runner=wat2do-scraper" >> "$GITHUB_OUTPUT"
            else
              echo "cache_ent_id is present, but Mac mini is offline. Falling back to ubuntu-latest explicit media."
              echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Standard notification processing does not require the Mac mini. Routing to ubuntu-latest."
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

  process-post:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    environment: production

    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ENVIRONMENT: production
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      EVENT_FEED_REVALIDATION_SECRET: ${{ secrets.EVENT_FEED_REVALIDATION_SECRET }}
      POSTER_ID: ${{ inputs.poster_id }}
      INTENDED_RECIPIENT_ID: ${{ github.event.client_payload.intended_recipient_id || github.event.client_payload.notification_dict['com.instagram.android.igns.logging.intended_recipient_id'] || fromJSON(inputs.notification_payload || '{}')['com.instagram.android.igns.logging.intended_recipient_id'] }}
      TARGET_SCHOOL: ${{ github.event_name == 'workflow_dispatch' && inputs.school || '' }}
      CUTOFF_DAYS: ${{ github.event_name == 'workflow_dispatch' && '1825' || github.event.client_payload.cutoff_days || '1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate job inputs
        id: validate
        env:
          NOTIFICATION_JSON: ${{ inputs.notification_payload || toJSON(github.event.client_payload.notification_dict) }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$FRONTEND_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$OPENAI_API_KEY"
          test -n "$APIFY_API_TOKEN"
          test -n "$EVENT_FEED_REVALIDATION_SECRET"
          if [[ -z "$INTENDED_RECIPIENT_ID" && -z "$TARGET_SCHOOL" ]]; then
            echo "Either intended_recipient_id or school must be provided." >&2
            echo "Something is wrong!1!11!!1! Skipping remaining steps..." >&2
            echo "Raw payload: $NOTIFICATION_JSON" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$INTENDED_RECIPIENT_ID" ]] && ! [[ "$INTENDED_RECIPIENT_ID" =~ ^[1-9][0-9]{0,31}$ ]]; then
            echo "Invalid intended recipient ID format." >&2
            exit 1
          fi
          if ! [[ "$CUTOFF_DAYS" =~ ^(1|1825)$ ]]; then
            echo "Invalid cutoff days." >&2
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        if: steps.validate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure application storage
        if: steps.validate.outputs.skip != 'true'
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "STORAGE_BUCKET_NAME=wat2do-production-assets-$account_id" >> "$GITHUB_ENV"
          echo "STORAGE_PUBLIC_BASE_URL=https://wat2do.io/media" >> "$GITHUB_ENV"

      - name: Set up Python
        if: steps.validate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.validate.outputs.skip != 'true'
        working-directory: backend
        run: pip install --prefer-binary -r requirements.txt

      - name: Process the Instagram account
        if: steps.validate.outputs.skip != 'true'
        working-directory: backend
        env:
          NOTIFICATION_JSON: ${{ inputs.notification_payload || toJSON(github.event.client_payload.notification_dict) }}
        run: |
          export EVENT_FEED_REVALIDATION_URL="${FRONTEND_URL%/}/api/revalidate-events"
          if [[ "$NOTIFICATION_JSON" != "null" && -n "$NOTIFICATION_JSON" ]]; then
            echo "Processing raw notification payload..."
            python jobs/process_notification.py
          else
            echo "Processing standard poster_id..."
            python jobs/scrape.py \
              --username "$POSTER_ID" \
              --cutoff-days "$CUTOFF_DAYS" \
              --dry-run false
          fi

      - name: Trigger background scraper
        if: success() && steps.validate.outputs.skip != 'true'
        run: gh workflow run scrape-pending-media.yml -f cutoff_days="$CUTOFF_DAYS"
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
