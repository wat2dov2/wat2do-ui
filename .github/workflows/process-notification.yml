name: Process Notifications
run-name: >-
  ${{
    github.event.client_payload.notification_dict && format('{0} - {1}', github.event.client_payload.notification_dict['android.title'], github.event.client_payload.notification_dict['android.subText']) ||
    inputs.notification_payload && format('{0} - {1}', fromJSON(inputs.notification_payload || '{}')['android.title'], fromJSON(inputs.notification_payload || '{}')['android.subText']) ||
    format('Process @{0}', inputs.poster_id)
  }}

# Process forwarded Instagram notifications or a manually selected handle.
# Triggered either manually (workflow_dispatch) or by an external service
# posting to repository_dispatch with type=new_instagram_post.
#
# When triggered manually, the workflow uses a five-year cutoff instead of
# one day so an admin can backfill an account that hasn't been scraped before.

on:
  repository_dispatch:
    types: [new_instagram_post]
  workflow_dispatch:
    inputs:
      poster_id:
        description: 'Instagram username or exact post URL to process'
        required: false
        type: string
      school:
        description: 'School name'
        required: false
        type: string
      notification_payload:
        description: 'Raw JSON payload of the notification'
        required: false
        type: string

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.check.outputs.runner }}
      routed: ${{ steps.check.outputs.routed }}
    steps:
      - id: check
        env:
          POSTER_ID: ${{ inputs.poster_id }}
          NOTIFICATION_JSON: ${{ inputs.notification_payload || toJSON(github.event.client_payload.notification_dict) }}
          INTENDED_RECIPIENT_ID: ${{ github.event.client_payload.intended_recipient_id || github.event.client_payload.notification_dict['com.instagram.android.igns.logging.intended_recipient_id'] || fromJSON(inputs.notification_payload || '{}')['com.instagram.android.igns.logging.intended_recipient_id'] }}
          TARGET_SCHOOL: ${{ github.event_name == 'workflow_dispatch' && inputs.school || '' }}
        run: |
          # Instagram also posts empty summary notifications with no recipient. Nothing can
          # route them, so they finish here instead of failing in "Validate job inputs".
          if [[ -z "$INTENDED_RECIPIENT_ID" && -z "$TARGET_SCHOOL" ]]; then
            echo "::notice::Skipped a notification with no intended recipient or school; nothing to process."
            echo 'routed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'routed=true' >> "$GITHUB_OUTPUT"
          fi
          # Digests need the Mac's browser worker. DMs are answered by its inbox sweep instead.
          if echo "$NOTIFICATION_JSON" | grep -q "cache_ent_id" \
            || [[ -n "$POSTER_ID" ]]; then
            echo 'runner=["self-hosted", "wat2do-macmini-browser"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          fi

  process-post:
    needs: route
    if: needs.route.outputs.routed == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    environment: production

    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
      ENVIRONMENT: production
      POSTER_ID: ${{ inputs.poster_id }}
      INTENDED_RECIPIENT_ID: ${{ github.event.client_payload.intended_recipient_id || github.event.client_payload.notification_dict['com.instagram.android.igns.logging.intended_recipient_id'] || fromJSON(inputs.notification_payload || '{}')['com.instagram.android.igns.logging.intended_recipient_id'] }}
      TARGET_SCHOOL: ${{ github.event_name == 'workflow_dispatch' && inputs.school || '' }}
      CUTOFF_DAYS: ${{ github.event_name == 'workflow_dispatch' && '1825' || github.event.client_payload.cutoff_days || '1' }}
      NOTIFICATION_JSON: ${{ inputs.notification_payload || toJSON(github.event.client_payload.notification_dict) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare notification runtime
        run: |
          # Runner context is unavailable in job-level env. These default runner
          # variables are available after the job has been assigned to a runner.
          # The runtime survives checkout's git clean, so a built binary is reused.
          {
            printf '%s\n' "NOTIFICATION_RUNTIME_ROOT=$RUNNER_TOOL_CACHE/wat2do-notification-$RUNNER_OS-$RUNNER_ARCH"
            printf '%s\n' "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Expose notification payload
        run: echo "$NOTIFICATION_JSON" > notification_payload.json

      - name: Upload notification payload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notification-payload
          path: notification_payload.json
          retention-days: 14

      - name: Validate job inputs
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_RUNTIME_SECRET_ARN"
          if [[ -z "$INTENDED_RECIPIENT_ID" && -z "$TARGET_SCHOOL" ]]; then
            echo "::error::Notification routing is missing: provide intended_recipient_id or school, then rerun this notification." >&2
            exit 1
          fi
          if [[ -n "$INTENDED_RECIPIENT_ID" ]] && ! [[ "$INTENDED_RECIPIENT_ID" =~ ^[1-9][0-9]{0,31}$ ]]; then
            echo "Invalid intended recipient ID format." >&2
            exit 1
          fi
          if ! [[ "$CUTOFF_DAYS" =~ ^(1|1825)$ ]]; then
            echo "Invalid cutoff days." >&2
            exit 1
          fi

      # The binary is built before any credential reaches the environment.
      - name: Read notification controls
        id: controls
        run: bash scripts/notification-binary.sh controls

      - name: Restore notification binary
        id: binary-cache
        if: ${{ !contains(needs.route.outputs.runner, 'self-hosted') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NOTIFICATION_RUNTIME_ROOT }}/bin/${{ steps.controls.outputs.fingerprint }}
          key: wat2do-browser-${{ runner.os }}-${{ runner.arch }}-${{ steps.controls.outputs.fingerprint }}

      - name: Set up Rust
        if: ${{ !contains(needs.route.outputs.runner, 'self-hosted') && steps.binary-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        if: ${{ !contains(needs.route.outputs.runner, 'self-hosted') && steps.binary-cache.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust

      - name: Build notification binary
        timeout-minutes: ${{ fromJSON(steps.controls.outputs.build_timeout_minutes) }}
        env:
          CARGO_TARGET_DIR: ${{ !contains(needs.route.outputs.runner, 'self-hosted') && format('{0}/rust/target', github.workspace) || '' }}
        run: bash scripts/notification-binary.sh ensure

      - name: Save notification binary
        if: ${{ !contains(needs.route.outputs.runner, 'self-hosted') && steps.binary-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NOTIFICATION_RUNTIME_ROOT }}/bin/${{ steps.controls.outputs.fingerprint }}
          key: wat2do-browser-${{ runner.os }}-${{ runner.arch }}-${{ steps.controls.outputs.fingerprint }}

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read database configuration
        run: |
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "$AWS_RUNTIME_SECRET_ARN" \
            --query SecretString \
            --output text)"
          database_url="$(printf '%s' "$secret_json" | python3 -c 'import json, sys; print(json.load(sys.stdin)["DATABASE_URL"])')"
          unset secret_json
          echo "::add-mask::$database_url"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"

      - name: Process the Instagram account
        timeout-minutes: ${{ fromJSON(steps.controls.outputs.process_timeout_minutes) }}
        working-directory: backend
        run: |
          if [[ "$NOTIFICATION_JSON" != "null" && -n "$NOTIFICATION_JSON" ]]; then
            echo "Processing raw notification payload..."
            "$NOTIFICATION_BINARY" process-notification
          else
            "$NOTIFICATION_BINARY" retrieve \
              --school "$TARGET_SCHOOL" \
              --url "$POSTER_ID" \
              --cutoff-days "$CUTOFF_DAYS"
            echo "Queued $POSTER_ID for ingestion; the Mac's processor picks it up within seconds."
          fi
