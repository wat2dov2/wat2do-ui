name: Process Notifications
run-name: >-
  ${{
    github.event.client_payload.notification_dict && format('{0} - {1}', github.event.client_payload.notification_dict['android.title'], github.event.client_payload.notification_dict['android.subText']) ||
    format('Process @{0}', inputs.poster_id)
  }}

# Process forwarded Instagram notifications or a manually selected handle.
# Triggered either manually (workflow_dispatch) or by an external service
# posting to repository_dispatch with type=new_instagram_post.
#
# When triggered manually, the workflow uses a five-year cutoff instead of
# one day so an admin can backfill an account that hasn't been scraped before.

on:
  repository_dispatch:
    types: [new_instagram_post]
  workflow_dispatch:
    inputs:
      poster_id:
        description: 'Instagram username to process'
        required: true
        type: string
      school:
        description: 'School name'
        required: true
        type: string

jobs:
  select-runner:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check Mac mini runner status
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN || github.token }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/actions/runners" --jq '.runners[] | select(.name == "wat2do-mac-mini" or .name == "wat2do-scraper" or (.labels[]?.name == "wat2do-scraper")) | .status' 2>/dev/null || echo "offline")
          if [[ "$status" == "online" ]]; then
            echo "Mac mini runner is online."
            echo "runner=wat2do-scraper" >> "$GITHUB_OUTPUT"
          else
            echo "Mac mini runner status is '$status'. Falling back to ubuntu-latest."
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

  process-post:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    environment: production

    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ENVIRONMENT: production
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      EVENT_FEED_REVALIDATION_SECRET: ${{ secrets.EVENT_FEED_REVALIDATION_SECRET }}
      POSTER_ID: ${{ inputs.poster_id }}
      INTENDED_RECIPIENT_ID: ${{ github.event.client_payload.intended_recipient_id || github.event.client_payload.notification_dict['com.instagram.android.igns.logging.intended_recipient_id'] }}
      TARGET_SCHOOL: ${{ github.event_name == 'workflow_dispatch' && inputs.school || '' }}
      CUTOFF_DAYS: ${{ github.event_name == 'workflow_dispatch' && '1825' || '1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate job inputs
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$FRONTEND_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$OPENAI_API_KEY"
          test -n "$APIFY_API_TOKEN"
          test -n "$EVENT_FEED_REVALIDATION_SECRET"
          if [[ -z "$INTENDED_RECIPIENT_ID" && -z "$TARGET_SCHOOL" ]]; then
            echo "Either intended_recipient_id or school must be provided." >&2
            exit 1
          fi
          if [[ -n "$INTENDED_RECIPIENT_ID" ]] && ! [[ "$INTENDED_RECIPIENT_ID" =~ ^[1-9][0-9]{0,31}$ ]]; then
            echo "Invalid intended recipient ID format." >&2
            exit 1
          fi
          if ! [[ "$CUTOFF_DAYS" =~ ^(1|1825)$ ]]; then
            echo "Invalid cutoff days." >&2
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure application storage
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "STORAGE_BUCKET_NAME=wat2do-production-assets-$account_id" >> "$GITHUB_ENV"
          echo "STORAGE_PUBLIC_BASE_URL=https://wat2do.io/media" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: pip install --prefer-binary -r requirements.txt

      - name: Process the Instagram account
        working-directory: backend
        env:
          NOTIFICATION_JSON: ${{ toJSON(github.event.client_payload.notification_dict) }}
          SESSION_FAILURE_REPORT_PATH: ${{ runner.temp }}/instagram-digest-session-failures.json
        run: |
          export EVENT_FEED_REVALIDATION_URL="${FRONTEND_URL%/}/api/revalidate-events"
          if [[ "$NOTIFICATION_JSON" != "null" && -n "$NOTIFICATION_JSON" ]]; then
            echo "Processing raw notification payload..."
            python jobs/process_notification.py
          else
            echo "Processing standard poster_id..."
            python jobs/scrape.py \
              --username "$POSTER_ID" \
              --cutoff-days "$CUTOFF_DAYS" \
              --dry-run false
          fi

      - name: Upload sanitized Instagram session failure context
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: instagram-digest-session-failures
          path: ${{ runner.temp }}/instagram-digest-session-failures.json
          if-no-files-found: warn
          retention-days: 1
