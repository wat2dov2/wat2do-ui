name: Process Notifications
run-name: >-
  ${{
    github.event.client_payload.notification_dict && format('{0} - {1}', github.event.client_payload.notification_dict['android.title'], github.event.client_payload.notification_dict['android.subText']) ||
    inputs.notification_payload && format('{0} - {1}', fromJSON(inputs.notification_payload || '{}')['android.title'], fromJSON(inputs.notification_payload || '{}')['android.subText']) ||
    format('Process @{0}', inputs.poster_id)
  }}

# Process forwarded Instagram notifications or a manually selected handle.
# Triggered either manually (workflow_dispatch) or by an external service
# posting to repository_dispatch with type=new_instagram_post.
#
# When triggered manually, the workflow uses a five-year cutoff instead of
# one day so an admin can backfill an account that hasn't been scraped before.

on:
  repository_dispatch:
    types: [new_instagram_post]
  workflow_dispatch:
    inputs:
      poster_id:
        description: 'Instagram username or exact post URL to process'
        required: false
        type: string
      school:
        description: 'School name'
        required: false
        type: string
      media_provider:
        description: 'Media retrieval provider (browser queue by default)'
        required: false
        type: choice
        options: [browser, apify]
        default: browser
      notification_payload:
        description: 'Raw JSON payload of the notification'
        required: false
        type: string

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.check.outputs.runner }}
      media_provider: ${{ steps.check.outputs.media_provider }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          MEDIA_PROVIDER: ${{ inputs.media_provider }}
          POSTER_ID: ${{ inputs.poster_id }}
          NOTIFICATION_JSON: ${{ inputs.notification_payload || toJSON(github.event.client_payload.notification_dict) }}
        run: |
          provider="${MEDIA_PROVIDER:-$(jq -r '.notification_media_provider' backend/controlbox/instagram_browser.json)}"
          echo "media_provider=$provider" >> "$GITHUB_OUTPUT"
          if echo "$NOTIFICATION_JSON" | grep -q "cache_ent_id" || [[ -n "$POSTER_ID" && "$provider" == "browser" ]]; then
            echo 'runner=["self-hosted", "wat2do-macmini-browser"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          fi

  process-post:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    environment: production

    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ENVIRONMENT: production
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      EVENT_FEED_REVALIDATION_SECRET: ${{ secrets.EVENT_FEED_REVALIDATION_SECRET }}
      POSTER_ID: ${{ inputs.poster_id }}
      INTENDED_RECIPIENT_ID: ${{ github.event.client_payload.intended_recipient_id || github.event.client_payload.notification_dict['com.instagram.android.igns.logging.intended_recipient_id'] || fromJSON(inputs.notification_payload || '{}')['com.instagram.android.igns.logging.intended_recipient_id'] }}
      TARGET_SCHOOL: ${{ github.event_name == 'workflow_dispatch' && inputs.school || '' }}
      CUTOFF_DAYS: ${{ github.event_name == 'workflow_dispatch' && '1825' || github.event.client_payload.cutoff_days || '1' }}
      NOTIFICATION_JSON: ${{ inputs.notification_payload || toJSON(github.event.client_payload.notification_dict) }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare notification runtime
        run: |
          # Runner context is unavailable in job-level env. These default runner
          # variables are available after the job has been assigned to a runner.
          # The runtime survives checkout's git clean across lockfile revisions.
          runtime_root="$RUNNER_TOOL_CACHE/wat2do-notification-$RUNNER_OS-$RUNNER_ARCH"
          {
            printf '%s\n' "NOTIFICATION_RUNTIME_ROOT=$runtime_root"
            printf '%s\n' "NOTIFICATION_RUNNER_NAME=$RUNNER_NAME"
            printf '%s\n' "UV_CACHE_DIR=$runtime_root/uv-cache"
            printf '%s\n' "UV_PYTHON_INSTALL_DIR=$runtime_root/python"
            printf '%s\n' "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Expose notification payload
        run: echo "$NOTIFICATION_JSON" > notification_payload.json

      - name: Upload notification payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notification-payload
          path: notification_payload.json
          retention-days: 14

      - name: Validate job inputs
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$FRONTEND_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$OPENAI_API_KEY"
          test -n "$EVENT_FEED_REVALIDATION_SECRET"
          if [[ -z "$INTENDED_RECIPIENT_ID" && -z "$TARGET_SCHOOL" ]]; then
            echo "::error::Notification routing is missing: provide intended_recipient_id or school, then rerun this notification." >&2
            exit 1
          fi
          if [[ -n "$INTENDED_RECIPIENT_ID" ]] && ! [[ "$INTENDED_RECIPIENT_ID" =~ ^[1-9][0-9]{0,31}$ ]]; then
            echo "Invalid intended recipient ID format." >&2
            exit 1
          fi
          if ! [[ "$CUTOFF_DAYS" =~ ^(1|1825)$ ]]; then
            echo "Invalid cutoff days." >&2
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure application storage
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "STORAGE_BUCKET_NAME=wat2do-production-assets-$account_id" >> "$GITHUB_ENV"
          echo "STORAGE_PUBLIC_BASE_URL=https://wat2do.io/media" >> "$GITHUB_ENV"

      - name: Check dependency setup capacity
        id: dependencies
        run: |
          python3 backend/scripts/notification_runtime.py prepare

      - name: Install uv
        id: uv
        timeout-minutes: ${{ fromJSON(steps.dependencies.outputs.setup_timeout_minutes) }}
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ steps.dependencies.outputs.uv_version }}
          enable-cache: ${{ !contains(needs.route.outputs.runner, 'self-hosted') }}
          cache-dependency-glob: "backend/requirements.lock"
          cache-local-path: ${{ env.UV_CACHE_DIR }}

      - name: Set up Python
        timeout-minutes: ${{ fromJSON(steps.dependencies.outputs.setup_timeout_minutes) }}
        working-directory: backend
        run: |
          if "$NOTIFICATION_VENV/bin/python" -c 'import sys; assert sys.version_info[:2] == (3, 12)' > /dev/null 2>&1; then
            echo "Reusing the runner's notification Python environment."
          elif ! uv venv --clear --python 3.12 "$NOTIFICATION_VENV"; then
            echo "::error::Notification Python setup failed. Check runner disk capacity and Python download connectivity, then rerun this notification; its media has not been processed." >&2
            exit 1
          fi

      - name: Install dependencies
        timeout-minutes: ${{ fromJSON(steps.dependencies.outputs.install_timeout_minutes) }}
        working-directory: backend
        run: |
          if ! uv pip sync --python "$NOTIFICATION_VENV/bin/python" requirements.lock; then
            echo "::error::Notification dependency installation failed. Check runner disk capacity and package download connectivity, then rerun this notification; its media has not been processed." >&2
            exit 1
          fi

      - name: Process the Instagram account
        id: process
        timeout-minutes: ${{ fromJSON(steps.dependencies.outputs.process_timeout_minutes) }}
        working-directory: backend
        run: |
          export EVENT_FEED_REVALIDATION_URL="${FRONTEND_URL%/}/api/revalidate-events"
          if [[ "$NOTIFICATION_JSON" != "null" && -n "$NOTIFICATION_JSON" ]]; then
            echo "Processing raw notification payload..."
            "$NOTIFICATION_VENV/bin/python" jobs/process_notification.py
          elif [[ "${{ needs.route.outputs.media_provider }}" == "browser" ]]; then
            "$NOTIFICATION_VENV/bin/python" scripts/instagram_browser.py retrieve \
              --school "$TARGET_SCHOOL" \
              --url "$POSTER_ID" \
              --cutoff-days "$CUTOFF_DAYS"
          else
            test -n "$APIFY_API_TOKEN"
            echo "Processing standard poster_id..."
            "$NOTIFICATION_VENV/bin/python" jobs/scrape.py \
              --username "$POSTER_ID" \
              --cutoff-days "$CUTOFF_DAYS" \
              --dry-run false
          fi

      - name: Trigger background scraper
        if: success() && steps.process.outputs.new_items > 0 && needs.route.outputs.media_provider == 'apify'
        run: gh workflow run scrape-pending-media.yml -f cutoff_days="$CUTOFF_DAYS" -f media_provider=apify
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}

      - name: Maintain notification dependency cache
        if: always()
        working-directory: backend
        run: |
          python3 scripts/notification_runtime.py maintain
