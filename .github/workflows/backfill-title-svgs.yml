name: Backfill title SVGs

# Draws the title SVG of every soon event listed before the ingestion agent
# wrote them (`wat2do-ingest backfill-title-svgs`), on the Mac mini, against
# production's database, at the commit production runs. Run it by hand after a
# deploy; a second run picks up only events the first did not reach.

on:
  workflow_dispatch:
    inputs:
      days:
        description: Events whose next date starts within this many days
        default: "30"
        type: string
      event_ids:
        description: Only these events, comma-separated (empty for every soon event)
        default: ""
        type: string
      limit:
        description: At most this many events this run
        default: "500"
        type: string
      dry_run:
        description: Only count the events waiting
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backfill:
    name: Draw missing title SVGs on the Mac mini
    runs-on: [self-hosted, wat2do-macmini-deploy]
    environment: production
    # It builds in the deploy's checkout, so it never runs beside a deploy.
    concurrency:
      group: deploy-mac-mini
      cancel-in-progress: false
    timeout-minutes: 480
    steps:
      - name: Build wat2do-ingest at the deployed commit and draw the titles
        env:
          DAYS: ${{ inputs.days }}
          EVENT_IDS: ${{ inputs.event_ids }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$DAYS$LIMIT" in
            "" | *[!0-9]*) echo "days and limit must be whole numbers" >&2; exit 1 ;;
          esac
          case "$EVENT_IDS" in
            *[!0-9,]*) echo "event_ids must be comma-separated numbers" >&2; exit 1 ;;
          esac
          data="$HOME/wat2do-data"
          build="$HOME/wat2do-build"
          sha=$(basename "$(readlink "$data/releases/current")")
          git -C "$build" fetch --quiet origin
          git -C "$build" checkout --quiet --detach "$sha"
          (cd "$build/rust" && nice -n 10 cargo build --release --quiet --bin wat2do-ingest)
          flags="--days $DAYS --limit $LIMIT"
          if [ -n "$EVENT_IDS" ]; then flags="$flags --ids $EVENT_IDS"; fi
          if [ "$DRY_RUN" = true ]; then flags="$flags --dry-run"; fi

          # Claude Code signs in through the login keychain, which only the user's own
          # session can read, so the backfill runs as a one-off LaunchAgent there, the
          # way ingestion runs (launch_agents::claude_code_path is its path).
          label=io.wat2do.title-svg-backfill
          domain="gui/$(id -u)"
          plist="$HOME/Library/LaunchAgents/$label.plist"
          log="$HOME/.local/state/wat2do/ingestion/title-svg-backfill.log"
          mkdir -p "$(dirname "$log")"
          : >"$log"
          script=$(cat <<SCRIPT
          set -euo pipefail
          set -a; . "$data/config/backend.env"; set +a
          echo "Claude Code \$(claude --version)"
          model=\$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["model"])' "$build/backend/controlbox/ingestion.json")
          check=\$(printf 'Reply with the word ok.' | claude -p --model "\$model" --output-format json --no-session-persistence || true)
          printf '%s' "\$check" | python3 -c 'import json, sys; answer = json.load(sys.stdin); print("Claude Code cannot answer:", answer.get("result")) if answer.get("is_error") else None; sys.exit(1 if answer.get("is_error") else 0)'
          exec nice -n 10 "$build/rust/target/release/wat2do-ingest" backfill-title-svgs $flags
          SCRIPT
          )
          python3 - "$plist" "$label" "$log" "$script" "$HOME" <<'PLIST'
          import plistlib, sys
          plist, label, log, script, home = sys.argv[1:]
          path = f"{home}/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          with open(plist, "wb") as out:
              plistlib.dump({
                  "Label": label,
                  "ProgramArguments": ["/bin/bash", "-c", script],
                  "EnvironmentVariables": {"PATH": path, "HOME": home},
                  "StandardOutPath": log,
                  "StandardErrorPath": log,
                  "RunAtLoad": True,
              }, out)
          PLIST
          launchctl bootout "$domain/$label" 2>/dev/null || true
          launchctl bootstrap "$domain" "$plist"
          trap 'launchctl bootout "$domain/$label" 2>/dev/null || true; rm -f "$plist"' EXIT
          # Wait for the one run to end, then report it.
          sleep 5
          while launchctl print "$domain/$label" 2>/dev/null | grep -q "state = running"; do sleep 15; done
          cat "$log"
          status=$(launchctl print "$domain/$label" 2>/dev/null | awk -F'= ' '/last exit code/ {print $2; exit}')
          echo "backfill exited with ${status:-unknown}"
          [ "${status:-1}" = 0 ]
