name: Backfill title SVGs

# Draws the title SVG of every soon event listed before the ingestion agent
# wrote them (`wat2do-ingest backfill-title-svgs`), on the Mac mini, against
# production's database, at the commit production runs. Run it by hand after a
# deploy; a second run picks up only events the first did not reach.

on:
  workflow_dispatch:
    inputs:
      days:
        description: Events whose next date starts within this many days
        default: "30"
        type: string
      event_ids:
        description: Only these events, comma-separated (empty for every soon event)
        default: ""
        type: string
      limit:
        description: At most this many events this run
        default: "500"
        type: string
      dry_run:
        description: Only count the events waiting
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backfill:
    name: Draw missing title SVGs on the Mac mini
    runs-on: [self-hosted, wat2do-macmini-deploy]
    environment: production
    # It builds in the deploy's checkout, so it never runs beside a deploy.
    concurrency:
      group: deploy-mac-mini
      cancel-in-progress: false
    timeout-minutes: 480
    steps:
      - name: Build wat2do-ingest at the deployed commit and draw the titles
        env:
          DAYS: ${{ inputs.days }}
          EVENT_IDS: ${{ inputs.event_ids }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Claude Code lives in ~/.local/bin, first on the path as in every LaunchAgent (launch_agents::claude_code_path).
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "Claude Code $(claude --version)"
          # One short answer first, so a Claude Code that cannot run stops here with its own words.
          model=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["model"])' "$HOME/wat2do-build/backend/controlbox/ingestion.json")
          check=$(printf 'Reply with the word ok.' | claude -p --model "$model" --output-format json --no-session-persistence || true)
          if ! printf '%s' "$check" | python3 -c 'import json, sys; answer = json.load(sys.stdin); sys.exit(1 if answer.get("is_error") else 0)'; then
            echo "Claude Code cannot answer: $(printf '%s' "$check" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("result", "no result"))' 2>/dev/null || printf '%s' "$check" | head -c 300)" >&2
            exit 1
          fi
          case "$DAYS$LIMIT" in
            "" | *[!0-9]*) echo "days and limit must be whole numbers" >&2; exit 1 ;;
          esac
          case "$EVENT_IDS" in
            *[!0-9,]*) echo "event_ids must be comma-separated numbers" >&2; exit 1 ;;
          esac
          data="$HOME/wat2do-data"
          build="$HOME/wat2do-build"
          sha=$(basename "$(readlink "$data/releases/current")")
          git -C "$build" fetch --quiet origin
          git -C "$build" checkout --quiet --detach "$sha"
          (cd "$build/rust" && nice -n 10 cargo build --release --quiet --bin wat2do-ingest)
          set -a
          . "$data/config/backend.env"
          set +a
          flags=(--days "$DAYS" --limit "$LIMIT")
          if [ -n "$EVENT_IDS" ]; then flags+=(--ids "$EVENT_IDS"); fi
          if [ "$DRY_RUN" = true ]; then flags+=(--dry-run); fi
          nice -n 10 "$build/rust/target/release/wat2do-ingest" backfill-title-svgs "${flags[@]}"
