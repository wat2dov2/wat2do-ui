name: Daily Instagram maintenance and publishing drafts

on:
  schedule:
    - cron: '0 9 * * *'
      # Match instagram_publishing.json's generation_timezone, including DST.
      timezone: 'America/Toronto'
  workflow_dispatch:

concurrency:
  group: daily-instagram-publishing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
      ENVIRONMENT: production

    steps:
      - uses: actions/checkout@v4

      - name: Validate publishing configuration
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_RUNTIME_SECRET_ARN"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure application storage
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "STORAGE_BUCKET_NAME=wat2do-production-assets-$account_id" >> "$GITHUB_ENV"
          echo "STORAGE_PUBLIC_BASE_URL=https://wat2do.io/media" >> "$GITHUB_ENV"

      - name: Read publishing configuration
        run: |
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "$AWS_RUNTIME_SECRET_ARN" \
            --query SecretString \
            --output text)"
          for secret_key in SUPABASE_URL SUPABASE_KEY SUPABASE_SECRET_KEY OPENAI_API_KEY INSTAGRAM_TOKEN_ENCRYPTION_KEY; do
            secret_value="$(jq -er --arg key "$secret_key" '.[$key]' <<< "$secret_json")"
            echo "::add-mask::$secret_value"
            echo "$secret_key=$secret_value" >> "$GITHUB_ENV"
          done
          unset secret_json

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/requirements.lock"
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/.uv-cache

      - name: Set up Python
        working-directory: backend
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --python .venv/bin/python -r requirements.lock

      - name: Generate Instagram publishing drafts
        working-directory: backend
        run: .venv/bin/python jobs/generate_instagram_posts.py
