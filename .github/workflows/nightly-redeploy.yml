name: Nightly Auto-Redeploy

on:
  schedule:
    # 8:01 PM EST is 1:01 AM UTC. 8:01 PM EDT is 00:01 UTC.
    # To run safely after the 8:00 PM America/New_York peak hours window ends,
    # we run at 1:05 AM UTC (8:05 PM EST in winter, 9:05 PM EDT in summer).
    - cron: '5 1 * * *'
  workflow_dispatch: # Allow manual triggers

concurrency:
  group: nightly-redeploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check for new changes since last deployment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 6909c9a0-220a-4d6b-a22f-ae1686ea54d8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history to check git logs accurately

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.57.5

      - name: Check if redeploy is needed
        id: check
        run: python backend/scripts/check_redeploy.py

  backend-checks:
    name: Backend checks
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-anon-key
      SUPABASE_SECRET_KEY: test-service-role-key
      SUPABASE_JWT_SECRET: test-jwt-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --prefer-binary -r requirements-dev.txt

      - name: Check formatting
        working-directory: backend
        run: ruff format --check .

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type check
        working-directory: backend
        run: mypy .

      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend-checks:
    name: Frontend checks
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

  deploy-backend:
    name: Deploy backend to Railway
    needs: [check-changes, backend-checks, frontend-checks]
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 6909c9a0-220a-4d6b-a22f-ae1686ea54d8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        if: env.RAILWAY_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        if: env.RAILWAY_API_TOKEN != ''
        run: npm install -g @railway/cli@4.57.5

      - name: Skip Railway deploy until token is configured
        if: env.RAILWAY_API_TOKEN == ''
        run: echo "::notice::Set the RAILWAY_TOKEN repository secret to enable automatic Railway deploys."

      - name: Deploy backend
        if: env.RAILWAY_API_TOKEN != ''
        working-directory: backend
        run: railway up --project "$RAILWAY_PROJECT_ID" --service wat2do-api --environment production --detach

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: [check-changes, deploy-backend]
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_qHJlaMmeF0XtEpwDcDy8lBfW
      VERCEL_PROJECT_ID: prj_QIr7YgIs8FYXQzSDT9wT2BKdG8tu
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: npm ci

      - name: Skip Vercel deploy until token is configured
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::Set the VERCEL_TOKEN repository secret to enable automatic Vercel deploys."

      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel output
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
