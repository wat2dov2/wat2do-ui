name: Notify workflow failures

on:
  workflow_run:
    workflows:
      - CI/CD
      - Daily Directory Scrape
      - Daily Instagram maintenance and publishing drafts
      - Instagram digest session health
      - Monthly promoter poster payouts
      - Nightly recommendation compute
      - Process Notifications
      - Scheduled notification emails
      - Terraform
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify-discord:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: backend/controlbox/workflow_failure_alerts.json
          sparse-checkout-cone-mode: false

      - name: Download sanitized Instagram session context
        if: ${{ github.event.workflow_run.name == 'Instagram digest session health' || github.event.workflow_run.name == 'Process Notifications' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: instagram-digest-session-failures
          path: ${{ runner.temp }}/instagram-digest-session-failures
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Notify Wat2Do administrators
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEBUG_WEBHOOK_URL }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          session_failures=""
          session_report="$RUNNER_TEMP/instagram-digest-session-failures/instagram-digest-session-failures.json"
          if [[ ( "$WORKFLOW_NAME" == "Instagram digest session health" \
            || "$WORKFLOW_NAME" == "Process Notifications" ) \
            && -f "$session_report" \
            && ! -L "$session_report" ]]; then
            report_bytes="$(wc -c < "$session_report")"
            if [[ "$report_bytes" =~ ^[0-9]+$ ]] && (( report_bytes <= 65536 )); then
              session_failures="$(jq -er '
                def global_issue:
                  . == "audit_failed"
                  or . == "routing_lookup_failed"
                  or . == "keychain_index_invalid";
                def session_issue:
                  . == "invalid_routing"
                  or . == "duplicate_routing"
                  or . == "missing_session"
                  or . == "unindexed_session"
                  or . == "orphan_session"
                  or . == "invalid_session"
                  or . == "remote_check_failed"
                  or . == "persistence_failed";
                def valid_session:
                  type == "object"
                  and keys == [
                    "account_username",
                    "intended_recipient_id",
                    "issue",
                    "school",
                    "status"
                  ]
                  and (
                    .school == null
                    or (
                      (.school | type) == "string"
                      and (.school | test("^[a-z0-9][a-z0-9-]{0,63}$"))
                    )
                  )
                  and (
                    .account_username == null
                    or (
                      (.account_username | type) == "string"
                      and (.account_username | test("^[a-z0-9._]{1,30}$"))
                    )
                  )
                  and (
                    (.intended_recipient_id | type) == "string"
                    and (
                      (.intended_recipient_id | test("^[1-9][0-9]{0,31}$"))
                      or (
                        .issue == "invalid_routing"
                        and (.intended_recipient_id | test("^[A-Za-z0-9._:-]{0,64}$"))
                      )
                    )
                  )
                  and (
                    if .status == "healthy"
                    then .issue == null
                    else
                      (
                        .status == "missing"
                        or .status == "reauthorization_required"
                        or .status == "transient_error"
                        or .status == "configuration_error"
                      )
                      and (.issue | session_issue)
                    end
                  );
                if
                  type == "object"
                  and keys == ["healthy", "issues", "sessions"]
                  and .healthy == false
                  and (.issues | type) == "array"
                  and (.issues | length) <= 10
                  and all(.issues[]; type == "string" and global_issue)
                  and (.sessions | type) == "array"
                  and (.sessions | length) <= 100
                  and all(.sessions[]; valid_session)
                  and (
                    (.issues | length) > 0
                    or any(.sessions[]; .status != "healthy")
                  )
                then
                  (
                    [.issues[] | "audit: " + .]
                    + [
                        .sessions[]
                        | select(.status != "healthy")
                        | (
                            (.school // "unmapped")
                            + " / "
                            + (
                                if .account_username != null
                                then "@" + .account_username
                                elif .intended_recipient_id != ""
                                then "recipient " + .intended_recipient_id
                                else "invalid recipient"
                                end
                              )
                            + ": "
                            + .status
                            + " ("
                            + .issue
                            + ")"
                          )
                      ]
                  )
                  | join("\n")
                  | .[0:1024]
                else
                  error("invalid Instagram session health report")
                end
              ' "$session_report" 2>/dev/null || true)"
            fi
          fi
          role_ids="$(jq -cer '
            .discord_admin_role_ids
            | if length > 0 and all(.[]; type == "string" and test("^[0-9]{17,20}$"))
              then .
              else error("invalid Discord admin role IDs")
              end
          ' backend/controlbox/workflow_failure_alerts.json)"
          mentions="$(jq -r 'map("<@&" + . + ">") | join(" ")' <<< "$role_ids")"
          payload="$(jq -n \
            --arg content "$mentions" \
            --arg run_url "$RUN_URL" \
            --arg run_title "$RUN_TITLE" \
            --arg workflow_name "$WORKFLOW_NAME" \
            --arg branch "$HEAD_BRANCH" \
            --arg event "$TRIGGER_EVENT" \
            --arg actor "$RUN_ACTOR" \
            --arg completed_at "$COMPLETED_AT" \
            --arg session_failures "$session_failures" \
            --argjson roles "$role_ids" \
            '{
              content: $content,
              allowed_mentions: {
                parse: [],
                roles: $roles,
                users: [],
                replied_user: false
              },
              embeds: [{
                title: "GitHub Actions workflow failed",
                url: $run_url,
                color: 15158332,
                fields: (
                  [
                    {name: "Workflow", value: ($workflow_name[0:1024]), inline: true},
                    {name: "Branch", value: ($branch[0:1024]), inline: true},
                    {name: "Event", value: ($event[0:1024]), inline: true},
                    {name: "Run", value: ($run_title[0:1024])},
                    {name: "Triggered by", value: ($actor[0:1024]), inline: true}
                  ]
                  + (
                      if $session_failures == ""
                      then []
                      else [{name: "Affected sessions", value: $session_failures}]
                      end
                    )
                ),
                timestamp: $completed_at
              }]
            }')"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            --output /dev/null \
            "${DISCORD_WEBHOOK_URL}?wait=true"
