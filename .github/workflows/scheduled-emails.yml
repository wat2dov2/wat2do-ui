name: Scheduled notification emails

on:
  schedule:
    # Off the top of the hour, when GitHub drops the most scheduled runs.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      now:
        description: 'Optional ISO-8601 UTC timestamp for deterministic testing'
        required: false
        type: string

concurrency:
  group: scheduled-notification-emails-${{ github.event.schedule == '17 * * * *' && 'morning' || github.event_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      EMAIL_DELIVERY_ENABLED: "true"
      EMAIL_FROM: ${{ vars.AWS_EMAIL_FROM }}

    steps:
      - uses: actions/checkout@v4

      # The sender is built before any secret is in the environment, and only
      # when its code, embedded control box or logo changed since the last build.
      # The binary is kept outside target/, which rust-cache prunes, and saved
      # right after the build so a failed send does not lose it.
      - name: Restore the notification sender
        id: sender
        uses: actions/cache/restore@v4
        with:
          path: .sender/wat2do-send-notifications
          key: wat2do-send-notifications-${{ runner.os }}-${{ hashFiles('rust/**', 'backend/controlbox/*.json', 'backend/services/wat2do-logo.png') }}

      - name: Set up Rust
        if: steps.sender.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        if: steps.sender.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build the notification sender
        if: steps.sender.outputs.cache-hit != 'true'
        working-directory: rust
        env:
          # Link-time optimization would add minutes to every run for no
          # measurable gain in a job that mostly waits on the network.
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          cargo build --release --locked --bin wat2do-send-notifications
          mkdir -p ../.sender
          cp target/release/wat2do-send-notifications ../.sender/

      - name: Save the notification sender
        if: steps.sender.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sender/wat2do-send-notifications
          key: ${{ steps.sender.outputs.cache-primary-key }}

      - name: Verify notification configuration
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_RUNTIME_SECRET_ARN"
          test -n "$FRONTEND_URL"
          test -n "$EMAIL_FROM"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read notification configuration
        run: |
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "$AWS_RUNTIME_SECRET_ARN" \
            --query SecretString \
            --output text)"
          for secret_key in DATABASE_URL EMAIL_UNSUBSCRIBE_SECRET; do
            secret_value="$(jq -er --arg key "$secret_key" '.[$key]' <<< "$secret_json")"
            echo "::add-mask::$secret_value"
            echo "$secret_key=$secret_value" >> "$GITHUB_ENV"
          done
          unset secret_json

      - name: Dispatch scheduled emails
        working-directory: backend
        env:
          NOW: ${{ inputs.now }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          args=()
          if [[ -n "$NOW" ]]; then
            args+=(--now "$NOW")
          fi
          notification=all
          if [[ "$SCHEDULE" == "17 * * * *" ]]; then
            notification=morning_email
          fi
          args+=(--notification "$notification")
          ../.sender/wat2do-send-notifications "${args[@]}"
