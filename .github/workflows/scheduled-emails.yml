name: Scheduled notification emails

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      now:
        description: 'Optional ISO-8601 UTC timestamp for deterministic testing'
        required: false
        type: string

concurrency:
  group: scheduled-notification-emails-${{ github.event.schedule == '0 * * * *' && 'morning' || github.event_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
      ENVIRONMENT: production
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      EMAIL_PROVIDER: resend
      EMAIL_FROM: ${{ vars.AWS_EMAIL_FROM }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify notification configuration
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_RUNTIME_SECRET_ARN"
          test -n "$FRONTEND_URL"
          test -n "$EMAIL_FROM"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read notification configuration
        run: |
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "$AWS_RUNTIME_SECRET_ARN" \
            --query SecretString \
            --output text)"
          for secret_key in SUPABASE_URL SUPABASE_KEY SUPABASE_SECRET_KEY EMAIL_PROVIDER_API_KEY EMAIL_UNSUBSCRIBE_SECRET; do
            secret_value="$(jq -er --arg key "$secret_key" '.[$key]' <<< "$secret_json")"
            echo "::add-mask::$secret_value"
            echo "$secret_key=$secret_value" >> "$GITHUB_ENV"
          done
          unset secret_json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --prefer-binary -r requirements.txt

      - name: Dispatch scheduled emails
        working-directory: backend
        env:
          NOW: ${{ inputs.now }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          args=()
          if [[ -n "$NOW" ]]; then
            args+=(--now "$NOW")
          fi
          notification=all
          if [[ "$SCHEDULE" == "0 * * * *" ]]; then
            notification=morning_email
          elif [[ -n "$SCHEDULE" ]]; then
            notification=event_reminder
          fi
          args+=(--notification "$notification")
          python jobs/send_notifications.py "${args[@]}"
