name: Daily Directory Scrape

# Daily scheduled crawl of configured directory websites.
# Calls jobs/scrape_directories.py.

on:
  schedule:
    # Run daily at 08:00 UTC (4:00 AM EDT / 3:00 AM EST)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to crawl per directory'
        required: true
        type: string
        default: '5'
      dry_run:
        description: 'Dry run (crawl and parse, but no DB writes)'
        required: true
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ENVIRONMENT: production
      # Supabase credentials (read/write access bypassing RLS)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      # OpenAI extraction key
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --prefer-binary -r requirements.txt
          pip install beautifulsoup4

      - name: Run scraper
        working-directory: backend
        env:
          MAX_PAGES: ${{ inputs.max_pages || '5' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          mkdir -p logs
          set -o pipefail
          
          DRY_RUN_ARG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          
          python -u jobs/scrape_directories.py \
            --max-pages "$MAX_PAGES" \
            $DRY_RUN_ARG \
            2>&1 | tee logs/directory_scraping.log

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-scrape-logs-${{ github.run_number }}
          path: backend/logs/directory_scraping.log
          if-no-files-found: 'ignore'
