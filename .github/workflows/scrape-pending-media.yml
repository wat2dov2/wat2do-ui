name: Scrape Pending Media
run-name: Scrape Pending Media

# Processes pending Instagram media claims from the database queue
# Triggered by workflow_dispatch (from process-notification.yml) or other jobs

on:
  workflow_dispatch:
    inputs:
      cutoff_days:
        description: 'Number of days to look back'
        required: false
        type: string
        default: '1'

concurrency:
  group: scrape-pending
  cancel-in-progress: false

jobs:
  scrape-pending:
    runs-on: wat2do-heavy-pool
    strategy:
      matrix:
        worker: [1, 2, 3, 4, 5]
      fail-fast: false
    environment: production
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ENVIRONMENT: production
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 21600
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure application storage
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text || echo '123456789012')"
          echo "STORAGE_BUCKET_NAME=wat2do-production-assets-$account_id" >> "$GITHUB_ENV"
          echo "STORAGE_PUBLIC_BASE_URL=https://wat2do.io/media" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Python
        working-directory: backend
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --python .venv/bin/python -r requirements.txt

      - name: Scrape pending media
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          EVENT_FEED_REVALIDATION_SECRET: ${{ secrets.EVENT_FEED_REVALIDATION_SECRET }}
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          CUTOFF_DAYS: ${{ inputs.cutoff_days || '1' }}
          EVENT_FEED_REVALIDATION_URL: "${{ env.FRONTEND_URL }}/api/revalidate-events"
        run: |
          .venv/bin/python jobs/scrape_pending_media.py
