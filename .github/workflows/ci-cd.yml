name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-anon-key
      SUPABASE_SECRET_KEY: test-service-role-key
      SUPABASE_JWT_SECRET: test-jwt-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --prefer-binary -r requirements-dev.txt

      - name: Check formatting
        working-directory: backend
        run: ruff format --check .

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type check
        working-directory: backend
        run: mypy .

      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check i18n localization
        working-directory: frontend
        run: npm run audit:i18n

      - name: Type check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
          BACKEND_API_URL: http://localhost:8000
        run: npm run build

  social-preview:
    name: Social-preview checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: social-preview/package-lock.json

      - name: Install dependencies
        working-directory: social-preview
        run: npm ci

      - name: Run tests
        working-directory: social-preview
        run: npm test

  deploy-wat2do:
    name: Deploy Wat2Do to AWS
    runs-on: ubuntu-24.04-arm
    needs:
      - backend
      - frontend
      - social-preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: wat2do-production
      ECS_SERVICE: wat2do-production-app
      ECS_TASK_FAMILY: wat2do-production-app
      SOCIAL_PREVIEW_FUNCTION: wat2do-production-social-preview

    steps:
      # Full history: the migration guard below diffs against the previous
      # commit, which a shallow checkout does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify AWS deployment configuration
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_DEPLOY_ROLE_ARN"


      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read frontend build configuration
        env:
          FRONTEND_BUILD_SECRET_ID: wat2do/production/frontend-build
        run: |
          secret_json="$(aws secretsmanager get-secret-value --secret-id "$FRONTEND_BUILD_SECRET_ID" --query SecretString --output text)"
          for secret_key in NEXT_PUBLIC_MAPBOX_TOKEN NEXT_PUBLIC_GOOGLE_MAPS_API_KEY NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN NEXT_PUBLIC_POSTHOG_HOST; do
            secret_value="$(jq -er --arg key "$secret_key" '.[$key]' <<< "$secret_json")"
            echo "::add-mask::$secret_value"
            echo "$secret_key=$secret_value" >> "$GITHUB_ENV"
          done
          unset secret_json

      - name: Build and push backend image
        id: backend-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/wat2do/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

      - name: Build and push frontend image
        id: frontend-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/wat2do/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend,ignore-error=true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            API_REWRITE_URL=http://127.0.0.1:8000
            BACKEND_API_URL=http://127.0.0.1:8000
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ env.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ env.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ env.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ env.NEXT_PUBLIC_POSTHOG_HOST }}
            APP_VERSION=${{ github.sha }}

      - name: Wait for social-preview ECR repository
        run: |
          for _ in $(seq 1 60); do
            if aws ecr describe-repositories --repository-names wat2do/social-preview >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The wat2do/social-preview ECR repository was not created by the foundation deployment."
          exit 1

      - name: Build and push social-preview image
        id: social-preview-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: social-preview/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.login-ecr.outputs.registry }}/wat2do/social-preview:${{ github.sha }}
          cache-from: type=gha,scope=social-preview
          cache-to: type=gha,mode=max,scope=social-preview,ignore-error=true

      - name: Smoke test frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          frontend_image="$ECR_REGISTRY/wat2do/frontend:${{ github.sha }}"
          container_id="$(docker run --detach --platform linux/arm64 --publish 127.0.0.1::3000 "$frontend_image")"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          published_port="$(docker port "$container_id" 3000/tcp)"
          published_port="${published_port##*:}"

          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$published_port/healthz" >/dev/null; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != 'true' ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done

          docker logs "$container_id"
          exit 1

      - name: Register immutable ECS task revisions
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FRONTEND_DIGEST: ${{ steps.frontend-image.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
        run: |
          frontend_image="$ECR_REGISTRY/wat2do/frontend@$FRONTEND_DIGEST"
          backend_image="$ECR_REGISTRY/wat2do/backend@$BACKEND_DIGEST"
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query taskDefinition --output json > task-definition.json
          jq --arg frontend_image "$frontend_image" --arg backend_image "$backend_image" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            | .containerDefinitions |= map(
              if (.name == "frontend" or .name == "frontend-cache-init") then .image = $frontend_image
              elif .name == "backend" then .image = $backend_image
              else . end
            )
          ' task-definition.json > rendered-task-definition.json
          task_definition_arn="$(aws ecs register-task-definition --cli-input-json file://rendered-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "TASK_DEFINITION_ARN=$task_definition_arn" >> "$GITHUB_ENV"

      # Schema must land before the code that queries it. Without this, a commit
      # adding a migration deploys code against a database that lacks the column.
      # Skipped until the Supabase deploy credentials are configured, so adding
      # this step cannot break deploys that do not touch the schema.
      - name: Set up Supabase CLI
        if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          # Detection must never fail quietly: a diff that errors out and gets
          # swallowed reads as "this push adds no migrations", which is exactly
          # how unapplied schema once reached production. Force pushes and the
          # first push to a branch have no usable before-sha, so fall back to
          # this commit's parent rather than to silence.
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before="$(git rev-parse "${{ github.sha }}^")"
          fi
          added_migrations="$(git diff --name-only --diff-filter=A \
            "$before" "${{ github.sha }}" -- backend/supabase/migrations/)"

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            if [ -n "$added_migrations" ]; then
              echo "::error::This push adds migrations but Supabase deploy credentials are not configured."
              echo "::error::Set the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD secrets and the"
              echo "::error::SUPABASE_PROJECT_REF variable, or apply these migrations manually before merging:"
              echo "$added_migrations"
              exit 1
            fi
            echo "Supabase deploy credentials not configured and no new migrations in this push; skipping."
            exit 0
          fi

          cd backend
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked

      - name: Deploy task revision and wait for service stability
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$TASK_DEFINITION_ARN"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Deploy social-preview Lambda image when provisioned
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SOCIAL_PREVIEW_DIGEST: ${{ steps.social-preview-image.outputs.digest }}
        run: |
          if ! aws lambda get-function --function-name "$SOCIAL_PREVIEW_FUNCTION" >/dev/null 2>&1; then
            echo "Social-preview Lambda is not provisioned yet; Terraform will create it from this release image."
            exit 0
          fi

          image="$ECR_REGISTRY/wat2do/social-preview@$SOCIAL_PREVIEW_DIGEST"
          aws lambda update-function-code \
            --function-name "$SOCIAL_PREVIEW_FUNCTION" \
            --image-uri "$image" \
            >/dev/null
          aws lambda wait function-updated-v2 --function-name "$SOCIAL_PREVIEW_FUNCTION"

      - name: Smoke test school subdomain scoping
        run: ./scripts/smoke-subdomains.sh

      - name: Surface stopped-task diagnostics
        if: failure()
        run: |
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --output json
          stopped_tasks="$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --desired-status STOPPED --query 'taskArns' --output text)"
          if [ -n "$stopped_tasks" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $stopped_tasks --output json
          fi
          aws logs tail /wat2do/production/frontend --since 30m || true
          aws logs tail /wat2do/production/backend --since 30m || true
