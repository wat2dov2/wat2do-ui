name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  # A newer push replaces a pull request's checks, but never cancels a run on main
  # mid-deploy; the deploy job also queues on its own group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DATA_API_URL: https://data.example.test
      DATA_API_KEY: test-service-key

    steps:
      - uses: actions/checkout@v4

      - name: Validate notification workflow expressions
        run: bash scripts/check-notification-workflow.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/requirements*.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements-dev.txt

      - name: Check formatting
        working-directory: backend
        run: ruff format --check .

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type check
        working-directory: backend
        run: mypy .

      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check i18n localization
        working-directory: frontend
        run: npm run audit:i18n

      - name: Type check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Test frontend behavior without a browser
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-layout:
    name: Loading states keep their layout
    # Pinned: ubuntu-latest moved to 26.04 on 2026-11-10 and Playwright cannot install Chromium there yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build with browser-test API fixtures
        working-directory: frontend
        env:
          PLAYWRIGHT_TEST: '1'
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      - name: Compare loading states with the content that replaces them
        working-directory: frontend
        env:
          PLAYWRIGHT_TEST: '1'
          # A phone-speed CPU, where a page hydrates before slow code arrives.
          SKELETON_LAYOUT_CPU_THROTTLE: '4'
        run: |
          npx next start -p 3000 -H 127.0.0.1 > next.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/healthz && break
            sleep 1
          done
          npx playwright test e2e/skeleton-layout.spec.ts --project=chromium --workers=1 || { tail -50 next.log; exit 1; }

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-layout
          path: frontend/test-results
          if-no-files-found: ignore

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  rust-database:
    name: Rust database tests
    # The Rust API's statements on its login and write paths (sign-in,
    # refresh rotation, the code lockout and single use; submissions, their
    # review and uploads) against a real Postgres holding our schema: every
    # test module named database_tests.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Load the schema
        # As scripts/dev.py loads the local database: the roles, then the
        # baseline and every migration after it. The image's own psql reads the
        # baseline's pg_dump 17 commands.
        run: |
          docker run --rm --network host --volume "$PWD:/workspace:ro" --env DATABASE_URL postgres:17 \
            bash -c 'psql "$DATABASE_URL" --no-psqlrc --quiet -v ON_ERROR_STOP=1 \
                       -f /workspace/backend/database/local-roles.sql &&
                     bash /workspace/scripts/migrate-database.sh'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run database tests
        working-directory: rust
        env:
          WAT2DO_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          # A missing URL fails the run instead of skipping every test.
          WAT2DO_DATABASE_TESTS_REQUIRED: "1"
        run: cargo test --lib database_tests

  backend-image:
    name: Backend image build
    # Builds and smoke-tests the backend image that make dev runs
    # (docker-compose.dev.yml), so a broken Dockerfile or Rust build is caught
    # before merge.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: wat2do-backend:check
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

      - name: Smoke test the API server and the Python app behind it
        run: |
          image=wat2do-backend:check
          # The binary runs in the runtime image and reports the committed route inventory.
          docker run --rm "$image" wat2do-api openapi | diff - backend/core/rust_openapi.json
          # Serve with throwaway settings (no database is reached): /health must turn
          # healthy once uvicorn is up, a FastAPI route must answer through the proxy,
          # and SIGTERM must stop both processes cleanly. The server refuses to
          # start without a signing key, so it gets a throwaway one.
          signing_key="$(openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -outform DER | base64 --wrap=0)"
          container_id="$(docker run --detach --read-only --tmpfs /tmp \
            --env ENVIRONMENT=testing \
            --env AUTH_SIGNING_KEY="$signing_key" \
            --env DATA_API_URL=https://data.example.test \
            --env DATA_API_KEY=test-service-key \
            --env DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres \
            --publish 127.0.0.1::8000 "$image")"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          port="$(docker port "$container_id" 8000/tcp)"
          port="${port##*:}"
          for _ in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:$port/health"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:$port/health"
          curl --fail --silent --output /dev/null "http://127.0.0.1:$port/openapi.json"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$port/no-such-route")" = 404
          docker stop --time 30 "$container_id" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = 0

  build-wat2do:
    name: Build Wat2Do on the Mac mini
    # Starts with the checks instead of after them: it compiles and assembles the
    # release (~/wat2do-data/releases/<sha>) but changes nothing live, so the
    # deploy below waits only for the checks.
    runs-on: [self-hosted, wat2do-macmini-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One build at a time in the shared build checkout (the title SVG backfill uses it too).
    concurrency:
      group: build-mac-mini
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build and assemble the release
        timeout-minutes: 60
        run: bash infra/mac-mini/deploy.sh build "$GITHUB_SHA"

  deploy-wat2do:
    name: Deploy Wat2Do to the Mac mini
    # The Mac mini serves the API and data behind a Cloudflare Tunnel, and the
    # website and media run on AWS (docs/projects/mac-mini-hosting.md).
    runs-on: [self-hosted, wat2do-macmini-deploy]
    needs:
      - backend
      - frontend
      - frontend-layout
      - rust
      - rust-database
      - build-wat2do
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    # A deploy is never cancelled halfway; a newer push waits and then deploys.
    concurrency:
      group: deploy-mac-mini
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Migrate and switch the release, then deploy the website to AWS
        timeout-minutes: 60
        run: bash infra/mac-mini/deploy.sh release "$GITHUB_SHA"

      # The first read after a deploy may rebuild the snapshot through the API.
      - name: Verify the website reads discovery through the API
        run: |
          curl --fail --silent --show-error --output /dev/null --max-time 120 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            'https://wat2do.io/api/discovery?school=uwaterloo&resource=events'

      - name: Smoke test school subdomain scoping
        run: ./scripts/smoke-subdomains.sh

      # wat2do.io is served by Vercel. It deploys last, so the API and
      # database it reads already run this commit. Only Vercel's build uses
      # the files in infra/vercel/ (the proxy that tells the API each
      # visitor's address, the Cloudflare ranges it trusts and the upload
      # allowlist), so they are copied in here, and a missing one fails the
      # deploy.
      - name: Deploy the website to Vercel
        timeout-minutes: 20
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for file in .vercelignore frontend/src/proxy.ts backend/controlbox/viewer_ip.json; do
            cp "infra/vercel/$file" "$file"
          done
          npx --yes vercel@65.11.0 deploy . --prod --yes \
            --token "$VERCEL_TOKEN" --scope tonyqiu123s-projects --project wat2do \
            --build-env "APP_VERSION=$GITHUB_SHA"

      - name: Surface service logs
        if: failure()
        run: tail -n 200 "$HOME/wat2do-data/logs/api.log" "$HOME/wat2do-data/logs/web.log" || true
