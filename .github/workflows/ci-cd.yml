name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-anon-key
      SUPABASE_SECRET_KEY: test-service-role-key
      SUPABASE_JWT_SECRET: test-jwt-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --prefer-binary -r requirements-dev.txt

      - name: Check formatting
        working-directory: backend
        run: ruff format --check .

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type check
        working-directory: backend
        run: mypy .

      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check i18n localization
        working-directory: frontend
        run: npm run audit:i18n

      - name: Type check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
          BACKEND_API_URL: http://localhost:8000
        run: npm run build

  deploy-backend:
    name: Deploy backend to Railway
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 6909c9a0-220a-4d6b-a22f-ae1686ea54d8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        if: env.RAILWAY_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        if: env.RAILWAY_API_TOKEN != ''
        run: npm install -g @railway/cli@4.57.5

      - name: Skip Railway deploy until token is configured
        if: env.RAILWAY_API_TOKEN == ''
        run: echo "::notice::Set the RAILWAY_TOKEN repository secret to enable automatic Railway deploys."

      - name: Deploy backend
        if: env.RAILWAY_API_TOKEN != ''
        working-directory: backend
        run: railway up --project "$RAILWAY_PROJECT_ID" --service wat2do-api --environment production --detach

  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - deploy-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      VERCEL_ORG_ID: team_qHJlaMmeF0XtEpwDcDy8lBfW
      VERCEL_PROJECT_ID: prj_QIr7YgIs8FYXQzSDT9wT2BKdG8tu
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: npm ci

      - name: Skip Vercel deploy until token is configured
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::Set the VERCEL_TOKEN repository secret to enable automatic Vercel deploys."

      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Expose Vercel environment to Next
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: cp .vercel/.env.production.local .env.production.local

      - name: Build Vercel output
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel output
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
