name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  # A newer push replaces a pull request's checks, but never cancels a run on main
  # mid-deploy; the deploy job also queues on its own group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DATA_API_URL: https://data.example.test
      DATA_API_KEY: test-service-key

    steps:
      - uses: actions/checkout@v4

      - name: Validate notification workflow expressions
        run: bash scripts/check-notification-workflow.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/requirements*.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements-dev.txt

      - name: Check formatting
        working-directory: backend
        run: ruff format --check .

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type check
        working-directory: backend
        run: mypy .

      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check i18n localization
        working-directory: frontend
        run: npm run audit:i18n

      - name: Type check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Test frontend behavior without a browser
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
          BACKEND_API_URL: http://localhost:8000
        run: npm run build

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  backend-image:
    name: Backend image build
    # Builds and smoke-tests the backend image that docker-compose.yml runs, so a
    # broken Dockerfile or Rust build is caught before merge.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: wat2do-backend:check
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

      - name: Smoke test the API server and the Python app behind it
        run: |
          image=wat2do-backend:check
          # The binary runs in the runtime image and reports the committed route inventory.
          docker run --rm "$image" wat2do-api openapi | diff - backend/core/rust_openapi.json
          # Serve with throwaway settings (no database is reached): /health must turn
          # healthy once uvicorn is up, a FastAPI route must answer through the proxy,
          # and SIGTERM must stop both processes cleanly.
          container_id="$(docker run --detach --read-only --tmpfs /tmp \
            --env ENVIRONMENT=testing \
            --env DATA_API_URL=https://data.example.test \
            --env DATA_API_KEY=test-service-key \
            --env DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres \
            --publish 127.0.0.1::8000 "$image")"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          port="$(docker port "$container_id" 8000/tcp)"
          port="${port##*:}"
          for _ in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:$port/health"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:$port/health"
          curl --fail --silent --output /dev/null "http://127.0.0.1:$port/openapi.json"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$port/no-such-route")" = 404
          docker stop --time 30 "$container_id" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = 0

  deploy-wat2do:
    name: Deploy Wat2Do to the Mac mini
    # The Mac mini serves production behind a Cloudflare Tunnel (docs/projects/mac-mini-hosting.md).
    runs-on: [self-hosted, wat2do-macmini-deploy]
    needs:
      - backend
      - frontend
      - rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    # A deploy is never cancelled halfway; a newer push waits and then deploys.
    concurrency:
      group: deploy-mac-mini
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build, migrate and switch the release
        timeout-minutes: 45
        run: bash infra/mac-mini/deploy.sh "$GITHUB_SHA"

      - name: Verify all-school discovery readiness
        run: |
          timeout_seconds="$(jq -r '.readiness_timeout_seconds' backend/controlbox/discovery_cache.json)"
          request_timeout="$(jq -r '.request_timeout_seconds' backend/controlbox/discovery_cache.json)"
          poll_interval="$(jq -r '.snapshot_check_seconds' backend/controlbox/discovery_cache.json)"
          deadline=$((SECONDS + timeout_seconds))
          until curl --fail --silent --show-error --max-time "$request_timeout" https://wat2do.io/api/discovery/readiness; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Discovery snapshots are not ready for every school."
              exit 1
            fi
            sleep "$poll_interval"
          done

      - name: Smoke test school subdomain scoping
        run: ./scripts/smoke-subdomains.sh

      - name: Surface service logs
        if: failure()
        run: tail -n 200 "$HOME/wat2do-data/logs/api.log" "$HOME/wat2do-data/logs/web.log" || true
