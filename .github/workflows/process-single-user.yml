name: Process Single User
run-name: Process @${{ github.event.client_payload.username || inputs.username }}

# One-off scrape of a single Instagram handle.
# Triggered either manually (workflow_dispatch) or by an external service
# posting to repository_dispatch with type=new_instagram_post.
#
# When triggered manually, the workflow uses a five-year cutoff instead of
# one day so an admin can backfill an account that hasn't been scraped before.

on:
  repository_dispatch:
    types: [new_instagram_post]
  workflow_dispatch:
    inputs:
      username:
        description: 'Instagram username to process'
        required: true
        type: string
      intended_recipient_id:
        description: 'Instagram profile ID that received the post (maps to school via school_mappings.py)'
        required: true
        type: string

jobs:
  process-post:
    runs-on: ubuntu-latest
    environment: production
    # Serialize Apify runs across this repo so we don't hit concurrent
    # rate limits when an external dispatcher fires several times in
    # quick succession.
    concurrency:
      group: apify-scrape-group
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: wat2do-production
      ECS_SERVICE: wat2do-production-app
      ECS_JOBS_TASK_FAMILY: wat2do-production-jobs
      USERNAME: ${{ github.event.client_payload.username || inputs.username }}
      INTENDED_RECIPIENT_ID: ${{ github.event.client_payload.intended_recipient_id || inputs.intended_recipient_id }}
      CUTOFF_DAYS: ${{ github.event_name == 'workflow_dispatch' && '1825' || '1' }}

    steps:
      - name: Validate job inputs
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          if ! [[ "$USERNAME" =~ ^[A-Za-z0-9._]{1,30}$ ]]; then
            echo "Invalid Instagram username." >&2
            exit 1
          fi
          if ! [[ "$INTENDED_RECIPIENT_ID" =~ ^[0-9]{1,32}$ ]]; then
            echo "Invalid intended recipient ID." >&2
            exit 1
          fi
          if ! [[ "$CUTOFF_DAYS" =~ ^(1|1825)$ ]]; then
            echo "Invalid cutoff days." >&2
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the private ECS jobs task
        run: |
          network_configuration="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)"
          test "$network_configuration" != "null"
          run_network_configuration="$(jq -n --argjson awsvpc_configuration "$network_configuration" '{awsvpcConfiguration: $awsvpc_configuration}')"
          overrides="$(jq -n \
            --arg username "$USERNAME" \
            --arg recipient_id "$INTENDED_RECIPIENT_ID" \
            --arg cutoff_days "$CUTOFF_DAYS" \
            '{containerOverrides: [{
              name: "backend-jobs",
              command: ["python", "jobs/scrape.py", "--username", $username, "--cutoff-days", $cutoff_days, "--dry-run", "false"],
              environment: [{name: "INTENDED_RECIPIENT_ID", value: $recipient_id}]
            }]}')"
          task_arn="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$ECS_JOBS_TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "$run_network_configuration" \
            --overrides "$overrides" \
            --query 'tasks[0].taskArn' \
            --output text)"
          test -n "$task_arn"
          test "$task_arn" != "None"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          task_json="$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" --output json)"
          echo "$task_json" | jq '{stoppedReason: .tasks[0].stoppedReason, containers: [.tasks[0].containers[] | {name, exitCode, reason}]}'
          exit_code="$(echo "$task_json" | jq -r '.tasks[0].containers[] | select(.name == "backend-jobs") | .exitCode // empty')"
          task_id="${task_arn##*/}"
          echo "CloudWatch log stream: ecs/backend-jobs/$task_id"
          if [ "$exit_code" != "0" ]; then
            echo "ECS job failed with exit code ${exit_code:-unknown}." >&2
            exit 1
          fi
