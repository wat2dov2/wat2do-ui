name: Process Single User
run-name: Process @${{ github.event.client_payload.username || github.event.client_payload.poster_id || inputs.poster_id }}

# One-off scrape of a single Instagram handle.
# Triggered either manually (workflow_dispatch) or by an external service
# posting to repository_dispatch with type=new_instagram_post.
#
# When triggered manually, the workflow uses a five-year cutoff instead of
# one day so an admin can backfill an account that hasn't been scraped before.

on:
  repository_dispatch:
    types: [new_instagram_post]
  workflow_dispatch:
    inputs:
      poster_id:
        description: 'Instagram username to process'
        required: true
        type: string
      school:
        description: 'School name'
        required: false
        type: string
        default: 'University of Waterloo'

jobs:
  process-post:
    runs-on: ubuntu-latest
    environment: production
    # Serialize Apify runs across this repo so we don't hit concurrent
    # rate limits when an external dispatcher fires several times in
    # quick succession.
    concurrency:
      group: apify-scrape-group
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
      ENVIRONMENT: production
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      POSTER_ID: ${{ github.event.client_payload.username || github.event.client_payload.poster_id || inputs.poster_id }}
      INTENDED_RECIPIENT_ID: ${{ github.event.client_payload.intended_recipient_id }}
      TARGET_SCHOOL: ${{ github.event.client_payload.school || inputs.school || 'University of Waterloo' }}
      CUTOFF_DAYS: ${{ github.event_name == 'workflow_dispatch' && '1825' || '1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate job inputs
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_RUNTIME_SECRET_ARN"
          test -n "$FRONTEND_URL"
          if ! [[ "$POSTER_ID" =~ ^[A-Za-z0-9._]{1,30}$ ]]; then
            echo "Invalid poster ID." >&2
            exit 1
          fi
          if [[ -z "$INTENDED_RECIPIENT_ID" && -z "$TARGET_SCHOOL" ]]; then
            echo "Either intended_recipient_id or school must be provided." >&2
            exit 1
          fi
          if [[ -n "$INTENDED_RECIPIENT_ID" ]] && ! [[ "$INTENDED_RECIPIENT_ID" =~ ^[0-9]{1,32}$ ]]; then
            echo "Invalid intended recipient ID format." >&2
            exit 1
          fi
          if ! [[ "$CUTOFF_DAYS" =~ ^(1|1825)$ ]]; then
            echo "Invalid cutoff days." >&2
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read scraper configuration
        run: |
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "$AWS_RUNTIME_SECRET_ARN" \
            --query SecretString \
            --output text)"
          for secret_key in SUPABASE_URL SUPABASE_KEY SUPABASE_SECRET_KEY OPENAI_API_KEY APIFY_API_TOKEN EVENT_FEED_REVALIDATION_SECRET; do
            secret_value="$(jq -er --arg key "$secret_key" '.[$key]' <<< "$secret_json")"
            echo "::add-mask::$secret_value"
            echo "$secret_key=$secret_value" >> "$GITHUB_ENV"
          done
          unset secret_json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --prefer-binary -r requirements.txt

      - name: Process the Instagram account
        working-directory: backend
        run: |
          export EVENT_FEED_REVALIDATION_URL="${FRONTEND_URL%/}/api/revalidate-events"
          python jobs/scrape.py \
            --username "$POSTER_ID" \
            --cutoff-days "$CUTOFF_DAYS" \
            --dry-run false
