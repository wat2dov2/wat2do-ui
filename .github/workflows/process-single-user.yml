name: Process Single User
run-name: Process @${{ github.event.client_payload.username || inputs.username }}

# One-off scrape of a single Instagram handle.
# Triggered either manually (workflow_dispatch) or by an external service
# posting to repository_dispatch with type=new_instagram_post.
#
# When triggered manually, the workflow uses a five-year cutoff instead of
# one day so an admin can backfill an account that hasn't been scraped before.

on:
  repository_dispatch:
    types: [new_instagram_post]
  workflow_dispatch:
    inputs:
      username:
        description: 'Instagram username to process'
        required: true
        type: string
      intended_recipient_id:
        description: 'Instagram profile ID that received the post (maps to school via school_mappings.py)'
        required: true
        type: string

jobs:
  process-post:
    runs-on: ubuntu-latest
    # Serialize Apify runs across this repo so we don't hit concurrent
    # rate limits when an external dispatcher fires several times in
    # quick succession.
    concurrency:
      group: apify-scrape-group
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      ENVIRONMENT: production
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      # INTENDED_RECIPIENT_ID is read by jobs/scrape.py to resolve the school.
      INTENDED_RECIPIENT_ID: ${{ github.event.client_payload.intended_recipient_id || inputs.intended_recipient_id }}
      # IGNORE_CUTOFF is converted to --cutoff-days in the run step below.
      IGNORE_CUTOFF: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --prefer-binary -r requirements.txt

      - name: Run scraper for single user
        working-directory: backend
        run: |
          mkdir -p logs
          set -o pipefail
          # Convert IGNORE_CUTOFF to a concrete cutoff-days limit (5 years / 1825 days if true, 1 day if false)
          if [ "$IGNORE_CUTOFF" = "true" ]; then
            CUTOFF_DAYS=1825
          else
            CUTOFF_DAYS=1
          fi
          USERNAME='${{ github.event.client_payload.username || inputs.username }}'
          python -u jobs/scrape.py \
            --username "$USERNAME" \
            --cutoff-days "$CUTOFF_DAYS" \
            --dry-run false \
            2>&1 | tee logs/scraping.log

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-user-logs-${{ github.run_number }}
          path: backend/logs/scraping.log
          if-no-files-found: 'ignore'
