name: Nightly recommendation compute

on:
  schedule:
    # Run after the 08:00 UTC directory scrape has had time to finish.
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-recommendation-compute
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_RUNTIME_SECRET_ARN: ${{ vars.AWS_RUNTIME_SECRET_ARN }}
      ENVIRONMENT: production

    steps:
      - uses: actions/checkout@v4

      - name: Verify recommendation configuration
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_RUNTIME_SECRET_ARN"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read recommendation configuration
        run: |
          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "$AWS_RUNTIME_SECRET_ARN" \
            --query SecretString \
            --output text)"
          for secret_key in SUPABASE_URL SUPABASE_KEY SUPABASE_SECRET_KEY DATABASE_URL; do
            secret_value="$(jq -er --arg key "$secret_key" '.[$key]' <<< "$secret_json")"
            echo "::add-mask::$secret_value"
            echo "$secret_key=$secret_value" >> "$GITHUB_ENV"
          done
          unset secret_json

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Python
        working-directory: backend
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --python .venv/bin/python -r requirements.txt

      - name: Compute recommendation snapshot
        working-directory: backend
        run: .venv/bin/python -m recommender.job
