name: Instagram digest session health

on:
  schedule:
    - cron: '43 11 * * *'
  workflow_dispatch:

concurrency:
  group: instagram-digest-session-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-sessions:
    runs-on: [self-hosted, macOS, ARM64, wat2do-scraper]
    environment: production
    timeout-minutes: 30
    env:
      ENVIRONMENT: production
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --prefer-binary -r requirements.txt

      - name: Check every Instagram digest session
        id: health
        working-directory: backend
        env:
          REPORT_PATH: ${{ runner.temp }}/instagram-digest-session-failures.json
        run: |
          exit_code=0
          python scripts/manage_instagram_digest_sessions.py health \
            --report-file "$REPORT_PATH" || exit_code=$?
          if ! [[ "$exit_code" =~ ^[0-9]+$ ]] || (( exit_code > 255 )); then
            echo "Invalid session health exit code." >&2
            exit 2
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized failure context
        if: ${{ steps.health.outputs.exit_code != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: instagram-digest-session-failures
          path: ${{ runner.temp }}/instagram-digest-session-failures.json
          if-no-files-found: warn
          retention-days: 1

      - name: Fail unhealthy session check
        if: ${{ steps.health.outputs.exit_code != '0' }}
        env:
          EXIT_CODE: ${{ steps.health.outputs.exit_code }}
        run: exit "$EXIT_CODE"
