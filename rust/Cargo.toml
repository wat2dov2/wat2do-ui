[package]
name = "wat2do"
version = "0.1.0"
edition = "2024"
publish = false
description = "wat2do backend services ported from Python"

[dependencies]
anyhow = "1"
axum = "0.8"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-lc-rs = "1"
aws-sdk-s3 = "1"
aws-sdk-sesv2 = "1"
base64 = "0.22"
bytes = "1"
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
fastrand = "2"
form_urlencoded = "1"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
htmlize = { version = "1", features = ["unescape"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
idna = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
indexmap = { version = "2", features = ["serde"] }
jpeg-encoder = "0.7.1"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
libc = "0.2"
mail-parser = "0.11"
parking_lot = "0.12"
percent-encoding = "2"
regex = "1"
ring = "0.17"
roxmltree = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
signal-hook = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-general-category = "1"
unicode-normalization = "0.1"
url = "2"
utoipa = { version = "6", features = ["preserve_order", "preserve_path_order", "uuid"] }
utoipa-axum = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
webp = "0.3"
wreq = { version = "=6.0.0-rc.31", features = ["json", "stream", "gzip", "deflate", "brotli"] }
wreq-util = "=3.0.0-rc.14"
qrcode = { version = "0.14", default-features = false }

[build-dependencies]
hex = "0.4"
sha2 = "0.10"

[profile.release]
lto = "thin"

[dev-dependencies]
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
flate2 = "1"
