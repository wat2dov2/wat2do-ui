<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wat2Do API Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-weight: 500;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .event-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            background: #fafafa;
        }
        .event-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .event-detail {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 5px;
        }
        .badge-category {
            background: #e3f2fd;
            color: #1976d2;
        }
        .badge-free {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .badge-paid {
            background: #fff3e0;
            color: #f57c00;
        }
        .badge-food {
            background: #fce4ec;
            color: #c2185b;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        button:hover {
            background: #1565c0;
        }
        .test-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Wat2Do API Connection Test</h1>
        
        <div class="test-info">
            <strong>Testing:</strong> Frontend → Backend API connection<br>
            <strong>API URL:</strong> <code>http://localhost:8000/events/</code><br>
            <strong>Expected:</strong> List of events from backend database
        </div>

        <button onclick="testAPI()">🔄 Test API Connection</button>
        
        <div id="status"></div>
        <div id="results"></div>
        <div id="raw-data" style="display:none;">
            <h3>Raw API Response:</h3>
            <pre id="json-output"></pre>
        </div>
    </div>

    <script>
        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            const rawDataDiv = document.getElementById('raw-data');
            const jsonOutput = document.getElementById('json-output');
            
            // Show loading
            statusDiv.innerHTML = '<div class="status loading">⏳ Testing API connection...</div>';
            resultsDiv.innerHTML = '';
            rawDataDiv.style.display = 'none';
            
            try {
                console.log('Fetching from http://localhost:8000/events/');
                const startTime = performance.now();
                
                const response = await fetch('http://localhost:8000/events/');
                const endTime = performance.now();
                const duration = Math.round(endTime - startTime);
                
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const events = await response.json();
                console.log('Events received:', events);
                
                // Show success
                statusDiv.innerHTML = `
                    <div class="status success">
                        ✅ API Connection Successful!<br>
                        <small>Response time: ${duration}ms | Events found: ${events.length}</small>
                    </div>
                `;
                
                // Display events
                if (events.length === 0) {
                    resultsDiv.innerHTML = '<p>No events found in database.</p>';
                } else {
                    resultsDiv.innerHTML = '<h2>Events from Backend:</h2>' + 
                        events.map(event => renderEvent(event)).join('');
                }
                
                // Show raw JSON
                jsonOutput.textContent = JSON.stringify(events, null, 2);
                rawDataDiv.style.display = 'block';
                
            } catch (error) {
                console.error('API Error:', error);
                statusDiv.innerHTML = `
                    <div class="status error">
                        ❌ API Connection Failed<br>
                        <small>${error.message}</small>
                    </div>
                `;
                
                // Show troubleshooting tips
                resultsDiv.innerHTML = `
                    <h3>Troubleshooting:</h3>
                    <ul>
                        <li>Is the backend running? Check: <code>curl http://localhost:8000/events/</code></li>
                        <li>CORS error? Check browser console for details</li>
                        <li>Network error? Verify backend is on port 8000</li>
                        <li>Check backend logs in terminal</li>
                    </ul>
                `;
            }
        }
        
        function renderEvent(event) {
            const price = event.price === null || event.price === 0 ? 'Free' : `$${event.price}`;
            const priceClass = event.price === null || event.price === 0 ? 'badge-free' : 'badge-paid';
            
            const date = event.dtstart_utc ? new Date(event.dtstart_utc).toLocaleString() : 'Date TBD';
            
            const food = event.food && event.food.length > 0 
                ? event.food.map(f => `<span class="badge badge-food">🍕 ${f}</span>`).join('') 
                : '';
            
            return `
                <div class="event-card">
                    <div class="event-title">${event.title}</div>
                    <div class="event-detail">
                        <span class="badge badge-category">${event.category || 'Events'}</span>
                        <span class="badge ${priceClass}">${price}</span>
                        ${food}
                        ${event.registration ? '<span class="badge" style="background:#ffebee;color:#c62828">Registration Required</span>' : ''}
                    </div>
                    <div class="event-detail">📍 ${event.location}</div>
                    <div class="event-detail">📅 ${date}</div>
                    ${event.description ? `<div class="event-detail" style="margin-top:8px">${event.description}</div>` : ''}
                    ${event.organization ? `<div class="event-detail">🏢 ${event.organization}</div>` : ''}
                </div>
            `;
        }
        
        // Auto-run test on page load
        window.addEventListener('load', () => {
            console.log('Page loaded, testing API...');
            testAPI();
        });
    </script>
</body>
</html>
