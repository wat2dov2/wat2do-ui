project_id = "waterloo-commons"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 15

[studio]
enabled = true
port = 54333
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3002"
additional_redirect_urls = ["http://localhost:3002/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 10
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "60s"
otp_expiry = 900
otp_length = 6

# Keep local email in Mailpit. Enable this block only in hosted Auth configuration,
# with a dedicated sending-only Resend key supplied out of band.
[auth.email.smtp]
enabled = false
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "waterloo-commons@localhost"
sender_name = "Waterloo Commons"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_restrict_commons_curators"

[storage]
enabled = true
file_size_limit = "10MiB"
