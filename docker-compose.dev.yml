services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      # Just use a plain Node image for dev to ensure hot-reload works easily
      dockerfile_inline: |
        FROM node:22-slim
        WORKDIR /workspace/frontend
        CMD ["sh", "-c", "npm install && npm run dev"]
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - API_REWRITE_URL=http://backend:8000
      - BACKEND_API_URL=http://backend:8000
      - CHOKIDAR_USEPOLLING=true # Helps with hot-reload inside Docker on some OS
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - /workspace/frontend/node_modules
      - ./backend/controlbox:/workspace/backend/controlbox
    depends_on:
      backend:
        condition: service_healthy
