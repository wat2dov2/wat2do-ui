services:
  database:
    build:
      context: ./backend/database
      dockerfile_inline: |
        FROM postgres:17
        RUN apt-get update \
          && apt-get install --yes --no-install-recommends postgresql-17-cron \
          && rm -rf /var/lib/apt/lists/*
    # Production preloads the same libraries.
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron,pg_stat_statements", "-c", "cron.database_name=wat2do"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wat2do
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
      # scripts/dev.py runs the migration runner, local roles and seed from here.
      - ./backend/database:/workspace/backend/database:ro
      - ./scripts:/workspace/scripts:ro
    healthcheck:
      # The first start's setup server listens only on its socket; wait for TCP.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  data-api:
    image: postgrest/postgrest:v14.5
    environment:
      # authenticator's development-only password comes from backend/database/local-roles.sql.
      PGRST_DB_URI: postgres://authenticator:authenticator@database:5432/wat2do
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: "1000"
      # Development-only signing secret. With no PGRST_DB_ANON_ROLE, a request
      # without a token signed by it is refused.
      PGRST_JWT_SECRET: local-development-data-api-jwt-secret
    ports:
      - "127.0.0.1:55433:3000"
    depends_on:
      database:
        condition: service_healthy

  backend:
    working_dir: /workspace/backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: development
      # Local data only: these override any production values in backend/.env.
      DATA_API_URL: http://data-api:3000
      # {"role": "service_role"} signed with the data-api service's development secret.
      DATA_API_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.O6dcW70Pm5arJhCi0KK_-4PKWFb3RIOB6kg2ceEm3Yw
      AUTH_SIGNING_KEY: ${DEV_AUTH_SIGNING_KEY:?run make dev}
      # The Rust API server reads Postgres directly.
      DATABASE_URL: postgresql://postgres:postgres@database:5432/wat2do
      FRONTEND_URL: http://wat2do.localhost:3000
      COOKIE_DOMAIN: .wat2do.localhost
      COOKIE_SECURE: "false"
      REFRESH_COOKIE_PATH: /api/auth/refresh
      CORS_ORIGINS: '["http://wat2do.localhost:3000"]'
      CORS_ORIGIN_REGEX: '^http://[a-z0-9-]+[.]wat2do[.]localhost:3000$$'
      EMAIL_DELIVERY_ENABLED: "true"
      AWS_REGION: ${AWS_REGION:-ca-central-1}
      EVENT_FEED_REVALIDATION_URL: ""
      WATCHFILES_FORCE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/workspace/backend
      - ./scripts:/workspace/scripts:ro
    command: wat2do-api serve --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-slim
        WORKDIR /workspace/frontend
        CMD ["sh", "-c", "npm ci && npm run dev -- --hostname 0.0.0.0"]
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - API_REWRITE_URL=http://backend:8000
      - BACKEND_API_URL=http://backend:8000
      - CHOKIDAR_USEPOLLING=true # Helps with hot-reload inside Docker on some OS
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_modules:/workspace/frontend/node_modules
      - frontend_next:/workspace/frontend/.next
      - ./backend/controlbox:/workspace/backend/controlbox
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  database_data:
  frontend_modules:
  frontend_next:
