services:
  backend:
    working_dir: /workspace/backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: development
      SUPABASE_URL: ${DEV_SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_KEY: ${DEV_SUPABASE_KEY:-}
      SUPABASE_SECRET_KEY: ${DEV_SUPABASE_SECRET_KEY:-}
      SUPABASE_JWT_ISSUER: ${DEV_SUPABASE_JWT_ISSUER:-}
      DATABASE_URL: ""
      FRONTEND_URL: http://wat2do.localhost:3000
      COOKIE_DOMAIN: .wat2do.localhost
      COOKIE_SECURE: "false"
      REFRESH_COOKIE_PATH: /api/auth/refresh
      CORS_ORIGINS: '["http://wat2do.localhost:3000"]'
      CORS_ORIGIN_REGEX: '^http://[a-z0-9-]+[.]wat2do[.]localhost:3000$$'
      EMAIL_PROVIDER: resend
      EVENT_FEED_REVALIDATION_URL: ""
      WATCHFILES_FORCE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/workspace/backend
      - ./scripts:/workspace/scripts:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-slim
        WORKDIR /workspace/frontend
        CMD ["sh", "-c", "npm ci && npm run dev -- --hostname 0.0.0.0"]
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - API_REWRITE_URL=http://backend:8000
      - BACKEND_API_URL=http://backend:8000
      - CHOKIDAR_USEPOLLING=true # Helps with hot-reload inside Docker on some OS
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_modules:/workspace/frontend/node_modules
      - frontend_next:/workspace/frontend/.next
      - ./backend/controlbox:/workspace/backend/controlbox
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  frontend_modules:
  frontend_next:
