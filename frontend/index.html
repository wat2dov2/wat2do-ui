<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>app</title>
    <script>
      // Apply theme immediately before React loads to prevent flash.
      // Key 'theme' must match STORAGE_KEYS.THEME in src/shared/constants/storageKeys.ts.
      // Cannot import the constant here (pre-module inline script).
      (function() {
        var raw = localStorage.getItem('theme');
        // StorageService wraps values in JSON.stringify, so theme is stored as '"dark"' or '"light"'
        var theme = null;
        try { theme = raw !== null ? JSON.parse(raw) : null; } catch(e) { theme = raw; }
        var isDark = theme !== null
          ? theme === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
